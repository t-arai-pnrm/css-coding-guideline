# 本書の表記の辞書。著者の文章での使い方に合わせる。付録E「用語集」と内容をそろえる。
version: 1
rules:
  - expected: セレクタ
    pattern: /セレクター/
  - expected: ブレイクポイント
    pattern: /ブレークポイント/
  - expected: コンテナ
    pattern: /コンテナー/
  - expected: メディアクエリ
    pattern: /メディアクエリー/
  - expected: プロパティ
    pattern: /プロパティー/
  - expected: ブラウザ
    pattern: /ブラウザー/
  - expected: ユーザー
    pattern: /ユーザ(?!ー)/
  - expected: レイヤー
    pattern: /レイヤ(?!ー)/
  - expected: ハーフレディング
    pattern: /ハーフ・レディング/
  - expected: デフォルト値
    pattern: /既定値/
  - expected: インターフェース
    pattern: /インタ(?:ー)?フェ(?:イ)?ス/
  - expected: 擬似
    pattern: /疑似/
