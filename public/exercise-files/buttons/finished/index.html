<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>21-2 ボタンとセクション見出しを作る（完成版）</title>
  <link rel="stylesheet" href="../../base.css">
  <link rel="stylesheet" href="compositions.css">
  <link rel="stylesheet" href="page-demo.css">
  <link rel="stylesheet" href="cta-band.css">
  <link rel="stylesheet" href="action-control.css">
  <link rel="stylesheet" href="patterns.css">
</head>
<body>
<div class="scoped page-demo">
  <section class="_section">
    <hgroup class="_heading">
      <p class="eyebrow" lang="en">Service</p>
      <h2 class="section-heading">制作のご相談</h2>
    </hgroup>
    <p class="_lead">コーポレートサイトの新規制作から、公開後の運用まで承ります。制作の流れと費用の目安は、サービス資料でご覧いただけます。</p>
    <div class="_actions | cluster" style="--cluster--gap: 16px">
      <a class="scoped action-control" href="#contact">お問い合わせ</a>
      <a class="scoped action-control" href="#document" data-variant="secondary">サービス資料を見る</a>
    </div>
    <a class="scoped action-control" href="#works" data-variant="text">制作実績を見る<span class="_arrow" aria-hidden="true">→</span></a>
  </section>

  <section class="scoped cta-band">
    <hgroup class="_heading">
      <p class="eyebrow" lang="en">Contact</p>
      <h2 class="section-heading">制作のご相談はこちら</h2>
    </hgroup>
    <p class="_lead">ご相談とお見積りは無料です。2営業日以内に、担当者からご連絡します。</p>
    <div class="_actions | cluster" style="--cluster--gap: 16px">
      <a class="scoped action-control" href="#contact">お問い合わせ</a>
      <a class="scoped action-control" href="#document" data-variant="secondary">サービス資料を見る</a>
    </div>
  </section>
</div>
</body>
</html>
