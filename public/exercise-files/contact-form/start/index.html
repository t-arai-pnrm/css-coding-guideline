<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>21-12 お問い合わせフォームを作る（開始版）</title>
  <link rel="stylesheet" href="../../base.css">
  <link rel="stylesheet" href="page-contact.css">
  <link rel="stylesheet" href="contact-form.css">
  <link rel="stylesheet" href="action-control.css">
  <link rel="stylesheet" href="patterns.css">
</head>
<body>
<div class="scoped page-contact">
  <hgroup class="_heading">
    <p class="eyebrow" lang="en">Contact</p>
    <h1 class="section-heading">お問い合わせ</h1>
  </hgroup>
  <!-- デモの中で送信しても画面が切り替わらないように、method="dialog" にしている -->
  <form class="scoped contact-form" method="dialog">
    <div class="_field">
      <label class="_label" for="contact-name">お名前 <span class="_required">必須</span></label>
      <input class="_text-control" id="contact-name" type="text" name="name" autocomplete="name" required>
    </div>
    <div class="_field">
      <label class="_label" for="contact-email">メールアドレス <span class="_required">必須</span></label>
      <input class="_text-control" id="contact-email" type="email" name="email" autocomplete="email" required aria-describedby="contact-email-hint">
      <p class="_hint" id="contact-email-hint">例：name@example.com</p>
    </div>
    <div class="_field">
      <label class="_label" for="contact-tel">電話番号</label>
      <input class="_text-control" id="contact-tel" type="tel" name="tel" autocomplete="tel">
    </div>
    <div class="_field">
      <label class="_label" for="contact-type">お問い合わせの種類 <span class="_required">必須</span></label>
      <select class="_text-control" id="contact-type" name="type" required>
        <option value="">選んでください</option>
        <option value="consultation">制作のご相談</option>
        <option value="estimate">お見積りのご依頼</option>
        <option value="recruit">採用について</option>
        <option value="other">その他</option>
      </select>
    </div>
    <div class="_field">
      <label class="_label" for="contact-message">お問い合わせ内容 <span class="_required">必須</span></label>
      <textarea class="_text-control" id="contact-message" name="message" required></textarea>
    </div>
    <div class="_field">
      <label class="_agree"><input id="contact-agree" type="checkbox" name="agree" required><span><a href="#privacy">個人情報の取り扱い</a>に同意する <span class="_required">必須</span></span></label>
    </div>
    <button class="scoped action-control" type="submit">送信する</button>
  </form>
</div>
</body>
</html>
