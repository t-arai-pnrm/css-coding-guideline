<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第10章の課題：カードを2か所に置く</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <ul class="stack" style="--stack--gap: calc(var(--spacing--md) * 1px)">
        <li>
          <article class="scoped news-card">
            <h2>サイトを公開しました</h2>
            <time datetime="2026-10-01">2026年10月1日</time>
            <p>最初のお知らせです。</p>
          </article>
        </li>
        <li>
          <article class="scoped news-card">
            <h2>営業時間を変更します</h2>
            <time datetime="2026-10-08">2026年10月8日</time>
            <p>11月から、平日の営業時間を1時間延ばします。</p>
          </article>
        </li>
      </ul>
    </main>
    <aside>
      <ul class="stack" style="--stack--gap: calc(var(--spacing--sm) * 1px); --news-card--padding: calc(var(--spacing--sm) * 1px)">
        <li>
          <article class="scoped news-card">
            <h2>年末年始の休業</h2>
            <time datetime="2026-10-12">2026年10月12日</time>
            <p>12月29日から1月3日まで休業します。</p>
          </article>
        </li>
        <li>
          <article class="scoped news-card">
            <h2>採用情報を更新しました</h2>
            <time datetime="2026-10-14">2026年10月14日</time>
            <p>デザイナーの募集を始めました。</p>
          </article>
        </li>
      </ul>
    </aside>
  </body>
</html>
