# 第11章 インタラクションとモーション

# 11-1 状態とフォーカスを表す
- id: hover-inside-any-hover
  level: 必須
  rule: '`:hover` のスタイルは `@media (any-hover: hover)` の中に書き、`(hover: hover)` や画面の幅で判定しない。'
  reason: タッチ操作の端末でホバーの状態が残り続けるのを防ぎつつ、タブレットにマウスをつないだ場合のように、ホバーできる入力がひとつでもあればホバーを有効にできるため。
  note: '条件は `(any-hover)` と省略せず、`(any-hover: hover)` と値まで書きます。'
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: hover-with-focus-visible
  level: 必須
  rule: ホバーで変える見た目は、`:focus-visible` にも同じように指定する。
  reason: キーボードで操作するユーザーにも同じ手がかりを示せ、フォーカスリングが見えにくい場面の補いにもなるため。
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: hover-only-when-operable
  level: 推奨
  rule: ホバーのスタイルは、`:any-link:hover` や `:enabled:hover` のように、操作できる状態に限定して書く。
  reason: '`href` のないカレントのリンクや、無効にしたボタンが、押せるかのように反応するのを防ぐため。'
  page: interaction/states-and-focus
  since: 0.1.0

- id: no-motion-on-focus-visible
  level: 禁止
  rule: キーボード操作によるフォーカスの移動にトランジションやアニメーションを掛けない。
  reason: 入力と表示の変化がずれて、反応が遅く感じられるため。
  note: 'トランジションは `&:not(:focus-visible)` の中に書き、`:focus-visible` のときは一度で切り替えます。'
  page: interaction/states-and-focus
  since: 0.1.0

- id: no-opacity-for-hover
  level: 非推奨
  rule: ホバーやフォーカスの変化を `opacity` で表さない。
  reason: 文字まで透けてコントラストが下がり、「なぜ透けるのか」という意図もコードから読み取れないため。
  note: 背景色や文字色を、トークンや相対カラー構文で作った別の色に変えます。
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: state-by-pseudo-class-or-aria
  level: 推奨
  rule: 状態のスタイルは、`:checked` などの擬似クラスか `aria-selected` などの ARIA 属性をセレクタにし、`.is-active` のような状態クラスを使わない。
  reason: 支援技術に伝わる状態と見た目の状態が必ず一致し、クラスと属性を二重に管理せずに済むため。
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: data-attribute-for-other-states
  level: 推奨
  rule: 擬似クラスでも ARIA 属性でも表せない状態（演出の進み具合や配置の向きなど）だけを、data 属性で表す。
  reason: 見た目のためだけの状態を、支援技術に伝わる意味と混ぜずに済むため。
  page: interaction/states-and-focus
  since: 0.1.0

- id: stretched-link-for-card
  level: 推奨
  rule: カード全体をリンクにするときは、`<a>` でカードを包まず、見出しのリンクの `::after` をカードいっぱいに広げ、フォーカスリングはカードの `:has(:focus-visible)` に出す。
  reason: リンクのテキストが見出しだけになり、スクリーンリーダーでカードの中身をすべて読み上げるような冗長さを避けられるため。
  note: カードの中にほかのリンクやボタンを置くときは、それらを `::after` より手前に重ねます。
  page: interaction/states-and-focus
  since: 0.1.0

# 11-2 モーションを実装する
- id: motion-needs-purpose
  level: 推奨
  rule: アニメーションを足す前に、状態の変化や操作の結果を伝えるという目的があるかを確かめ、目的のない動きは入れない。
  reason: 何度も触る UI の装飾的な動きは、待ち時間と操作の負担を増やすだけになるため。
  page: interaction/motion
  since: 0.1.0

- id: motion-only-with-no-preference
  level: 必須
  rule: 'トランジションとアニメーションは、`@media (prefers-reduced-motion: no-preference)` の中で指定する。'
  reason: 動きを減らす設定をしているユーザーに、めまいや吐き気の原因になる動きを見せないため。
  note: スピナーのように動きそのものが情報を伝えるものと、ポップオーバーやダイアログの出現のように一瞬の切り替えがかえって分かりにくい場合の、位置や大きさを変えないフェードは、条件の外に書いてかまいません。全称セレクタと `!important` で全体の動きを止める書き方には頼りません。
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: no-transition-all
  level: 禁止
  rule: '`transition: all` や `transition-property: all` を使わない。'
  reason: 関係のないプロパティまで動き、意図しないアニメーションや無駄な描画の負荷を生むため。
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: transition-longhand-with-tokens
  level: 推奨
  rule: トランジションは `transition-duration`、`transition-property`、`transition-timing-function` のロングハンドで書き、再生時間とイージングにはトークンを使う。
  reason: 動かすプロパティが一目で分かり、サイトの中で動きの速さと質感がそろうため。
  page: interaction/motion
  since: 0.1.0

- id: animate-composite-properties
  level: 推奨
  rule: 動かすプロパティは `opacity`、`translate`、`scale`、`rotate` を優先し、`inline-size` や `inset` のようにレイアウトが変わるプロパティは避ける。
  reason: レイアウトと描画をやり直さずに済み、動きが滑らかになるため。
  note: アコーディオンの高さのように、ほかに方法のない場合は例外です。`will-change` は常に指定しません。
  page: interaction/motion
  since: 0.1.0

- id: keyframes-single-property
  level: 推奨
  rule: グローバルな `@keyframes` は1つにつき1つのプロパティだけを変え、複数の動きは `animation-name` のカンマ区切りで組み合わせる。
  reason: プロパティごとに再生時間とイージングを選び分けられ、単体でも再利用できるため。
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: keyframes-omit-obvious-frame
  level: 推奨
  rule: '`@keyframes` の自明な `from` や `to` は省略し、要素がもともと持っている値に向けて（または、その値から）動かす。'
  reason: 値を書き込むと、要素の実際の値と食い違ったときに、動きの始めや終わりで値が飛ぶため。
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: keyframes-api-properties
  level: 推奨
  rule: 動きの起点や方向を変えたいときは、`@keyframes` の中で `--<keyframes の名前>--<値の名前>` のカスタムプロパティを参照し、使う側から値を渡す。
  reason: 同じ `@keyframes` を、起点や方向だけを変えて使い回せるため。
  note: '例：`--translate-from` の中で `var(--translate-from--y-value, 0)` を参照し、使う側で `--translate-from--y-value: 24px` を指定します。'
  page: interaction/motion
  since: 0.1.0

- id: keyframes-local-naming
  level: 推奨
  rule: 中間のフレームを持つものや、複数のプロパティを同時に動かす `@keyframes` は、コンポーネントの CSS に `--<コンポーネント>--<動きの名前>` の名前で定義する。
  reason: 特定の UI に結びついた動きをグローバルに置かず、名前の衝突も防げるため。
  page: interaction/motion
  since: 0.1.0

- id: starting-style-for-entry
  level: 推奨
  rule: '`display: none` から表示する要素の出現と退場は、`@starting-style` と `transition-behavior: allow-discrete` で動かす。'
  reason: JavaScript でクラスを付け外しするタイミングを調整しなくても、CSS だけで出現と退場の両方を動かせるため。
  note: '`@starting-style` は、開いた状態のセレクタの中に書きます。'
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: scroll-linked-method
  level: 推奨
  rule: スクロール位置に合わせて連続して変わる動きはスクロール駆動アニメーションで、画面に入ったときに1回だけ動かす演出は `IntersectionObserver` で属性を切り替えて作り、`scroll` イベントで毎回位置を計算しない。
  reason: スクロールのたびに位置を計算する処理はメインスレッドを占有し、動きがかくつく原因になるため。
  aiProne: true
  page: interaction/motion
  since: 0.1.0

- id: motion-mode-attribute
  level: 推奨
  rule: JavaScript で動かす演出の準備のスタイルは、JavaScript がルートに `data-motion-mode="motion"` を付けたときだけ当て、基本のスタイルは動かないときの最終状態として書く。
  reason: JavaScript が動かない環境や、動きを減らす設定をしている環境でも、すべての内容を読めるようにするため。
  page: interaction/motion
  since: 0.1.0

# 11-3 開閉する UI
- id: native-disclosure-elements
  level: 推奨
  rule: 開閉する UI は、`<dialog>`、`popover` 属性、`<details>`、`hidden="until-found"` のような HTML の機能で作り、`div` とクラスの付け外しで作らない。
  reason: フォーカスの移動、Esc キーでの閉じる操作、トップレイヤーへの表示、ページ内検索での展開を、ブラウザが引き受けてくれるため。
  aiProne: true
  page: interaction/disclosure
  since: 0.1.0

- id: dialog-command-attributes
  level: 推奨
  rule: モーダルの開閉は `command` 属性と `commandfor` 属性で行い、対応していないブラウザのためにポリフィルを読み込む。
  reason: '`showModal()` を呼ぶ JavaScript を書かずに済み、開閉のボタンが `<button>` に限られるので、マークアップの誤りも防げるため。'
  page: interaction/disclosure
  since: 0.1.0

- id: dialog-closedby-any
  level: 推奨
  rule: 背景のクリックで閉じるモーダルは `closedby="any"` で作り、クリックの位置を判定する処理を自作しない。
  reason: Esc キーと背景のクリックによる閉じる操作を、ブラウザの標準の振る舞いにそろえられるため。
  note: 対応していないブラウザでも、Esc キーと閉じるボタンでは閉じられます。
  page: interaction/disclosure
  since: 0.1.0

- id: no-custom-focus-trap
  level: 禁止
  rule: モーダルに、独自のフォーカストラップを実装しない。
  reason: '`showModal()` で開いたダイアログは背面を操作できない状態にするので不要であり、ブラウザのツールバーへの移動まで妨げてしまうため。'
  page: interaction/disclosure
  since: 0.1.0

- id: overscroll-contain-in-overlay
  level: 推奨
  rule: 'モーダルやドロワーの中でスクロールする要素には、`overscroll-behavior-block: contain` のように、スクロールする方向の軸だけにスクロールの連鎖を止める指定をする。'
  reason: 中の要素を端までスクロールしたときに、背面のページが続けてスクロールするのを防ぐため。
  note: '`dialog` と `[popover]` 自体には kiso.css が指定しています。軸を付けない `overscroll-behavior` は、横のスワイプで前のページに戻る操作まで止めてしまいます。'
  page: interaction/disclosure
  since: 0.3.0

- id: details-name-for-exclusive
  level: 推奨
  rule: 1つだけを開くアコーディオンは、同じ `name` 属性を付けた `<details>` で作る。
  reason: JavaScript を書かずに、ほかの項目を閉じる動作をブラウザに任せられるため。
  page: interaction/disclosure
  since: 0.1.0

- id: no-heading-in-summary
  level: 禁止
  rule: '`<summary>` の中に見出しの要素を入れない。'
  reason: '`<summary>` の中では見出しの役割が失われ、見出しで移動するユーザーが項目にたどり着けなくなるため。'
  note: 見出しの構造が必要なら、`hidden="until-found"` を使ったアコーディオンにします。
  page: interaction/disclosure
  since: 0.1.0

- id: details-content-for-panel
  level: 推奨
  rule: '`<details>` の開閉する部分の余白や開閉の動きは、`::details-content` に指定する。'
  reason: 中身を包む要素を足さずに済み、閉じる動きまで CSS だけで書けるため。
  page: interaction/disclosure
  since: 0.1.0

- id: hidden-until-found-for-panels
  level: 推奨
  rule: 'タブやアコーディオンの閉じたパネルは `hidden="until-found"` で隠し、`display: none` で隠さない。'
  reason: ページ内検索やページ内リンクで中身が見つかったとき、ブラウザが自動でパネルを開くため。
  aiProne: true
  page: interaction/disclosure
  since: 0.1.0

- id: hide-panels-after-init
  level: 必須
  rule: 開閉するパネルは初期のHTMLでは隠さず、開閉の処理の初期化が成功してから JavaScript で隠す。
  reason: JavaScript が無効な環境や、スクリプトの読み込みや実行に失敗した環境でも、中身を読めるようにするため。
  aiProne: true
  page: interaction/disclosure
  since: 0.2.0

- id: no-box-style-on-until-found
  level: 非推奨
  rule: '`hidden="until-found"` を付ける要素自体には、余白、枠線、背景を指定しない。'
  reason: '対応したブラウザは `content-visibility: hidden` で中身だけを隠すので、要素自体の余白や枠線は閉じていても表示されるため。'
  note: 余白や背景は、内側の要素に指定します。
  page: interaction/disclosure
  since: 0.1.0

# 11-4 フォーム部品
- id: accent-color-for-color-only
  level: 推奨
  rule: チェックボックス、ラジオボタン、スライダーの色を変えるだけなら、`accent-color` を使う。
  reason: ブラウザの部品の操作性やアクセシビリティをそのまま保てるため。
  page: interaction/forms
  since: 0.1.0

- id: style-input-directly
  level: 推奨
  rule: 'チェックボックスやラジオボタンの見た目を作り直すときは、`input` 自体に `appearance: none` を指定して描き、`input` を隠して別の要素で描かない。'
  reason: キーボードで操作できなくなる事故を防げ、フォーカスリングもそのまま表示されるため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: no-aspect-ratio-on-input
  level: 非推奨
  rule: '`input` 要素の大きさを `aspect-ratio` で決めない。'
  reason: Safari で縦横の比率が保たれず、部品が潰れることがあるため。
  note: '`inline-size` と `block-size` の両方を指定します。'
  page: interaction/forms
  since: 0.1.0

- id: switch-attribute-progressive
  level: 推奨
  rule: スイッチは `<input type="checkbox" switch>` で作り、`switch` 属性に対応していない環境でチェックボックスとして扱われることを許容する。
  reason: 対応した環境ではスクリーンリーダーがオンとオフで読み上げ、未対応の環境でも操作は損なわれないため。
  note: 'すべての環境でスイッチとして読み上げる必要がある場合は、`role="switch"` を加えます。`<button>` と `aria-pressed` はトグルボタンを表し、オンとオフの意味にならないので使いません。'
  page: interaction/forms
  since: 0.1.0

- id: user-invalid-for-errors
  level: 推奨
  rule: 入力エラーの見た目は、`:invalid` ではなく `:user-invalid` に指定する。
  reason: '`:invalid` は入力する前から当てはまり、ページを開いた時点でエラーが表示されてしまうため。'
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: field-sizing-for-textarea
  level: 推奨
  rule: '`<textarea>` には `field-sizing: content` を指定し、最小と最大の高さを `lh` 単位で決める。'
  reason: 入力した量に合わせて入力欄が伸び縮みし、未対応の環境では従来どおりの入力欄になるだけなため。
  page: interaction/forms
  since: 0.1.0

- id: input-font-size-min-1rem
  level: 推奨
  rule: 入力欄の文字サイズは `1rem`（16px 相当）以上にする。
  reason: iOS の Safari は、文字サイズが16px 未満の入力欄にフォーカスすると画面を拡大し、ページの見え方が変わってしまうため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: no-maximum-scale
  level: 禁止
  rule: 入力欄での拡大を防ぐために、`<meta name="viewport">` の `maximum-scale` や `user-scalable=no` でズームを止めない。
  reason: 拡大して読む必要のあるユーザーが、ページを拡大できなくなるため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

# 11-5 View Transitions で画面の切り替えをつなぐ
- id: view-transition-name-unique
  level: 禁止
  rule: 同時に表示される複数の要素に、同じ `view-transition-name` を付けない。
  reason: 名前が重複すると撮影に失敗し、ほかの要素やページ全体の動きも含めて、切り替え全体のアニメーションが行われなくなるため。
  note: 固定の名前は、ページに1つしかない要素にだけ付けます。
  aiProne: true
  page: interaction/view-transitions
  since: 0.3.0

- id: view-transition-match-element
  level: 推奨
  rule: '同じページの中の切り替えで、並んだ要素を1つずつ動かすときは、連番の名前を振らず、`view-transition-name: match-element` と `view-transition-class` を組み合わせる。'
  reason: 名前の管理をブラウザに任せられ、動きの指定も `::view-transition-group(.<クラス>)` の1か所にまとめられるため。
  note: '`match-element` はページ間の遷移では使えないので、ページ間でつなぐ要素には、前後のページで同じ名前を明示的に付けます。`view-transition-class` だけでは要素は個別に撮影されません。'
  aiProne: true
  page: interaction/view-transitions
  since: 0.3.0
