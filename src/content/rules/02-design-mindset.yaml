# 2-3 保守しやすさを最優先にする
- id: maintainability-first
  level: 推奨
  rule: 書き方に迷ったら、コードの短さや共通化よりも、ほかの人が読んで安全に直せる書き方を選ぶ。
  reason: Web サイトは公開後の更新と改修の期間のほうが長く、書いた本人以外が触ることも多いため。
  note: 公開後に更新する予定のない短期のキャンペーンサイトなどは例外です。
  page: design-mindset/maintainability
  since: 0.1.0

- id: rule-of-three
  level: 推奨
  rule: 似た記述の重複は許容し、共通化は同じものが3回現れてから、役割まで同じかを確かめて検討する。
  reason: 早すぎる共通化は影響範囲を広げ、一部だけ変えたいときに修飾クラスや上書きの分岐が増えるため。
  note: 一緒に変わるべき値だけを、デザイントークンで共有します。共通化の単位は、「画像と文章を横に並べる」程度の配置の共通点ではなく、役割まで同じ実質的な部品にします。
  page: design-mindset/maintainability
  since: 0.1.0

- id: explainable-declarations
  level: 必須
  rule: 宣言はひとつひとつ、なぜ必要かを説明できるものだけを書く。
  reason: 余計な宣言はほかのセレクタとぶつかり、どの値が勝つかが状況しだいになるうえ、打ち消すための上書きが増えるため。
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: no-redundant-width-100
  level: 禁止
  rule: 'ブロックレベルの要素や、`inset: 0` で広げた絶対配置の要素に、`width: 100%`（`inline-size: 100%`）を指定しない。'
  reason: 指定しなくても利用できる幅いっぱいに広がり、左右のマージンや `box-sizing` の変更と組み合わさると、はみ出しの原因になるため。
  note: '`<img>` のような置換要素や、`<button>` のようなフォーム部品には必要なことがあります。`min(320px, 100%)` のように、はみ出しを防ぐための `100%` は対象外です。'
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: stretch-over-width-100
  level: 推奨
  rule: '利用できる幅いっぱいに広げる指定が要る要素には、`inline-size: 100%` ではなく、`inline-size: -webkit-fill-available` と `inline-size: stretch` をこの順に書く。'
  reason: '`100%` は `margin` を含めずに包含ブロックの幅をそのまま当てはめるので、`margin` や `box-sizing: content-box` と組み合わさると親からはみ出すためです。`stretch` は `margin` を含めた箱を包含ブロックの幅に収めます。'
  note: 'フォーム部品、行方向のフレックスアイテム、左右の位置を片方しか決めていない絶対配置の要素などが対象です。揃えを変えていないグリッドアイテムは、指定しなくても広がります。子の周りの余白は、子の `margin` ではなく親の `padding` や `gap` で取ることを優先します（ルール `parent-owns-child-placement`）。`-moz-available` は書きません。'
  aiProne: true
  page: design-mindset/maintainability
  since: 0.11.0

- id: stretch-over-height-100
  level: 推奨
  rule: '子要素の高さを親にそろえるときは、`height: 100%` ではなく、親を grid にして `stretch` に任せる。'
  reason: '`height: 100%` は親の高さが明示されているときしか効かず、`min-block-size` で最小値だけを決めた親では成り立たないためです。高さのパーセント指定は、親の高さが中身から決まるときに循環して解決できず、`auto` として扱われます。'
  note: '置換要素（`img` など）のように、`stretch` では伸びず、明示しないと広がらない要素には、`block-size: 100%` を書いてよいです。ただし、`stretch` で広がるなら `stretch` を優先し、`100%` は `stretch` に任せられない場合に限ります。'
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: no-redundant-defaults
  level: 非推奨
  rule: CSS の初期値、ブラウザのデフォルトスタイル、リセット CSS、ベーススタイルで決まっている値を、理由なく指定し直さない。
  reason: 設計の一貫性が崩れ、デフォルト値の側を変えたときにも古い値が残り続けるため。
  note: 最初の要素だけマージンを打ち消すのではなく、`:not(:first-child)` や `* + *` で2つ目以降にだけ付けます。値を戻すときの書き方は「4-1 カスケード・詳細度・継承」のルールに従います。ブロックレベルの要素に付けた `vertical-align` や、フレックスアイテムに付けた `float` のように、その文脈でブラウザが無視するプロパティも消します。
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: margin-inline-auto-centering
  level: 必須
  rule: 'ブロックの左右の中央寄せには、`margin: 0 auto` や `margin: auto` ではなく `margin-inline: auto` を使う。'
  reason: '`margin: 0 auto` は上下のマージンまで上書きし、周りのレイアウトが子要素の間に入れた余白を消してしまうため。'
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: longhand-for-partial-change
  level: 推奨
  rule: サブプロパティの一部だけを変えるときは、ショートハンドではなくロングハンドで書く（`background` ではなく `background-color` など）。
  reason: ショートハンドは指定しなかったサブプロパティも初期値に戻し、ほかの場所で設定した値を壊すため。
  note: '`inset` や `border` のように、すべての辺にまとめて値を与える用途では問題になりにくいです。`flex: 1` は `flex-basis` も `0%` にするので、`flex-grow: 1` とは別物です。'
  aiProne: true
  page: design-mindset/maintainability
  since: 0.1.0

- id: no-font-shorthand
  level: 禁止
  rule: '`font` ショートハンドは、リセットの目的以外で使わない。'
  reason: 文字の大きさやファミリーだけでなく、`line-height` や `font-kerning` まで初期値に戻し、継承させたい値を壊すため。
  page: design-mindset/maintainability
  since: 0.1.0
