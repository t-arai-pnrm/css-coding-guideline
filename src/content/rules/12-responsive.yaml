# 第12章 レスポンシブデザイン

# 12-1 検討する順番
- id: responsive-escalation-order
  level: 必須
  rule: レスポンシブ対応は「静的 → イントリンシック → コンテナクエリ → メディアクエリ」の順に検討し、上の段階で解決できるなら下の段階を使わない。
  reason: 条件分岐が減り、想定していない幅や置き場所でも崩れにくくなるため。
  aiProne: true
  page: responsive/escalation
  since: 0.1.0

- id: no-responsive-for-static-elements
  level: 推奨
  rule: タグ、バッジ、アイコンのように本質的に固定サイズの要素は、レスポンシブにしない。
  reason: '`clamp()` やクエリを足しても見た目はほとんど変わらず、コードの複雑さだけが増えるため。'
  note: アイコンは `1em` で文字サイズに追従させれば十分です。
  page: responsive/escalation
  since: 0.1.0

- id: max-inline-size-over-fixed-width
  level: 推奨
  rule: 幅は固定値ではなく `max-inline-size` で上限を決め、固定値が必要なときは `min(100%, …)` ではみ出しを防ぐ。
  reason: 狭い画面や狭い場所に置かれたときにも、内容に合わせて縮むため。
  aiProne: true
  page: responsive/escalation
  since: 0.1.0

- id: min-block-size-over-fixed-height
  level: 推奨
  rule: 高さは固定せず、`min-block-size` か `aspect-ratio` で決める。
  reason: 内容が増えたときや、ユーザーが文字サイズを大きくしたときにも、中身があふれないため。
  aiProne: true
  page: responsive/escalation
  since: 0.1.0

- id: query-choice-by-layer
  level: 推奨
  rule: '`pages` レイヤーのスタイルではメディアクエリを、`components` レイヤーのスタイルではコンテナクエリを優先する。'
  reason: ページ全体の段組みはビューポートに依存するが、コンポーネントはどこに置かれるかを自分では知らないため。
  note: モーダルやトーストのように、ビューポートに固定されるコンポーネントはメディアクエリを使います。
  page: responsive/escalation
  since: 0.1.0

# 12-2 コンテナクエリ
- id: container-name-required
  level: 必須
  rule: コンテナには必ず名前を付け、`@container` の条件でもその名前を指定する。
  reason: コンテナが入れ子になったとき、どのコンテナを参照しているのかが曖昧になるのを防ぐため。
  aiProne: true
  page: responsive/container-queries
  since: 0.1.0

- id: container-name-dashed-ident
  level: 必須
  rule: コンテナの名前は `--` で始める（例：`--card-list`）。
  reason: 自分で付けた名前だとすぐに分かり、将来 CSS に追加されるキーワードとも衝突しないため。
  lint: 'Stylelint: `container-name-pattern`'
  aiProne: true
  page: responsive/container-queries
  since: 0.1.0

- id: container-shorthand
  level: 必須
  rule: コンテナは `container` ショートハンドで、名前と種類をまとめて指定する（`container-type` を単体で書かない）。
  reason: 名前の付け忘れを防ぐため。
  page: responsive/container-queries
  since: 0.1.0

- id: container-query-inline-size
  level: 必須
  rule: コンテナクエリの条件では、`width` ではなく `inline-size` を使う。
  reason: 書字方向に依存しない、論理的な指定にそろえるため。
  aiProne: true
  page: responsive/container-queries
  since: 0.1.0

- id: hide-label-visually-in-container-query
  level: 推奨
  rule: 'アイコンとラベルを並べた部品で、置かれた場所が狭いときにラベルを隠すなら、コンテナクエリの中で `display: none` ではなく視覚的に隠す指定を書く。'
  reason: 'アイコンを `aria-hidden="true"` にしている場合、ラベルまで消すとリンクやボタンの名前がなくなるため。幅の違う複数の場所に置いても、修飾クラスなしで切り替えられる。'
  note: 隠し方は `.-visually-hidden` と同じ考え方です。ユーティリティのクラスはクエリの条件で付け外しできないので、同じ種類の指定をコンポーネントの中に書きます。
  page: responsive/container-queries
  since: 0.3.0

- id: no-container-on-page-root
  level: 禁止
  rule: '`html`、`body`、ページ全体のレイアウト要素をコンテナにしない。'
  reason: 'ページ全体の切り替えはメディアクエリの役割であり、古い実装では中にある `position: fixed` の要素が正しく配置されなくなるため。'
  page: responsive/container-queries
  since: 0.1.0

- id: no-container-on-intrinsic-size
  level: 禁止
  rule: 幅が中身で決まる要素（インライン要素、`fit-content` の要素、`flex-basis` を指定していない flex アイテムなど）をコンテナにしない。
  reason: インライン方向のサイズの封じ込めが働き、幅が極端に小さく計算されるため。
  page: responsive/container-queries
  since: 0.1.0

- id: no-padding-on-container
  level: 非推奨
  rule: コンテナにする要素には `padding` や `border` を指定せず、レイアウトは子要素で行う。
  reason: コンテナの幅の計算がずれ、クエリの閾値や `cqi` の値が意図とずれるため。
  page: responsive/container-queries
  since: 0.1.0

- id: cqi-needs-named-container
  level: 必須
  rule: '`cqi` は、名前付きのコンテナがあると言い切れる子孫の要素でだけ使う。'
  reason: 有効なコンテナがないと小さいビューポート単位（`svi`）として計算され、置き場所によって値の意味が変わるため。
  aiProne: true
  page: responsive/container-queries
  since: 0.1.0

- id: no-container-type-size
  level: 非推奨
  rule: '`container-type: size` と、それを前提にした `cqb`、`cqh`、`cqmin`、`cqmax` は使わない。'
  reason: コンテナの高さが確定していないと効かず、使える場面がほとんどないため。
  page: responsive/container-queries
  since: 0.1.0

- id: no-container-utility-class
  level: 禁止
  rule: '`.container` のような汎用のクラスを作らない。`container` プロパティを持つ要素にだけ、`.sidebar-container` のように何のコンテナかが分かる名前を付ける。'
  reason: '`container` が CSS で意味を持つ語になったので、ただのラッパーに使うと誤解を招くため。'
  page: responsive/container-queries
  since: 0.1.0

- id: zoom-as-last-resort
  level: 非推奨
  rule: '`zoom` をレスポンシブ対応の手段として使わない。'
  reason: 文字も含めてすべてが縮小され、レイアウトの問題を解決せずに隠してしまうため。
  note: 想定の最小幅を下回ると破綻するコンポーネントのルートに限り、`1` を上限とする最後の保険として使えます。
  page: responsive/container-queries
  since: 0.1.0

# 12-3 メディアクエリとブレイクポイント
- id: media-query-for-macro-layout
  level: 推奨
  rule: メディアクエリは、ページ全体の段組み、ビューポートに固定された要素、常に画面幅いっぱいに表示されるブロックに限って使う。
  reason: それ以外の要素は、イントリンシックな手法やコンテナクエリのほうが置き場所の変化に強いため。
  page: responsive/media-queries
  since: 0.1.0

- id: query-range-syntax
  level: 必須
  rule: メディアクエリとコンテナクエリの条件は範囲構文（`>=` や `<`）で書き、`min-width` や `max-width` の書き方は使わない。
  reason: 条件を不等式として読め、境界の値を含むかどうかも明確になるため。
  lint: 'Stylelint: `media-feature-range-notation`（メディアクエリのみ）'
  aiProne: true
  page: responsive/media-queries
  since: 0.1.0

- id: mobile-first-queries
  level: 推奨
  rule: メディアクエリでは狭い画面向けのスタイルを基本に書き、広い画面で必要な差分だけを `width >=` の条件の中に書く。
  reason: 狭い画面のレイアウトのほうが単純なことが多く、打ち消すための指定が増えずに済むため。
  page: responsive/media-queries
  since: 0.1.0

- id: breakpoint-in-rem
  level: 必須
  rule: ブレイクポイントは rem で指定し、`calc(640 / 16 * 1rem)` のようにピクセル値からの変換を式で書く。
  reason: 文字サイズを大きくしているユーザーは実質的に使える幅が狭くなるので、rem で指定すれば切り替えもそれに追従するため。式にすれば、元のピクセル値も読み取れる。
  aiProne: true
  page: responsive/media-queries
  since: 0.1.0

- id: breakpoint-from-content
  level: 必須
  rule: ブレイクポイントはデバイスの幅ではなく、レイアウトが崩れる幅から決める。
  reason: 画面幅の種類は無数にあり、特定の端末の幅に合わせても、その間の幅で崩れるため。
  page: responsive/media-queries
  since: 0.1.0

- id: framework-breakpoint-variables
  level: 推奨
  rule: ブレイクポイントを変数として持つフレームワークを使う案件では、独自の値を足さず、フレームワークの変数を使う。
  reason: 案件の中でブレイクポイントの値がばらばらになるのを防ぐため。
  note: 'Sass の変数や Tailwind CSS の設定のように、ビルド時に値へ展開される変数が対象です。CSS のカスタムプロパティは、メディアクエリの条件では使えません（`no-var-in-query`）。'
  page: responsive/media-queries
  since: 0.3.0

- id: no-device-names
  level: 禁止
  rule: '`sp`、`tablet`、`pc` のようにデバイスを連想させる名前を、ブレイクポイントやクラス名（`.sp-only` など）に使わない。'
  reason: 画面の幅とデバイスの種類は一致せず、名前と実態がずれていくため。
  aiProne: true
  page: responsive/media-queries
  since: 0.1.0

- id: threshold-as-formula
  level: 推奨
  rule: クエリの閾値は、「列の最小幅×列数＋隙間×隙間の数」のように、レイアウトが成り立つ条件を `calc()` の式で書く。
  reason: 数値の根拠がコードに残り、列数や隙間を変えたときにも直しやすいため。
  page: responsive/media-queries
  since: 0.1.0

- id: no-var-in-query
  level: 禁止
  rule: '`@media` の条件と、`@container` のサイズの条件の中で `var()` を使わない。'
  reason: メディアクエリの条件ではカスタムプロパティを参照できず、コンテナのサイズの条件では仕様で認められていても対象のブラウザでそろって動かず、値が問い合わせるコンテナで解決されて意図とずれやすいため。
  note: 'スタイルクエリで `style(--a: var(--b))` のようにカスタムプロパティどうしを比べる条件は、対象にしません。'
  aiProne: true
  page: responsive/media-queries
  since: 0.1.0

- id: no-device-width-feature
  level: 禁止
  rule: '`device-width`、`device-height`、`device-aspect-ratio` をメディアクエリの条件に使わない。幅は `width` で判定する。'
  reason: これらは端末の画面そのものの大きさを調べ、ウィンドウの幅や分割表示、ズームで変わる実際の表示領域を反映しないため。
  aiProne: true
  page: responsive/media-queries
  since: 0.4.0

- id: any-pointer-not-width-for-input
  level: 推奨
  rule: '操作の手段に合わせて変える指定は、画面の幅ではなく `@media (any-pointer: fine)` や `@media (any-pointer: coarse)` で判定する。'
  reason: 画面の幅と入力の手段は対応しないため。`pointer` は主な入力だけを調べるので、タブレットにマウスをつないだ場合のように、使える入力が複数ある環境の一方を取りこぼす。
  note: '`pointer` を使ってよいのは、主な入力の精度だけに合わせたいときに限る。ホバーの判定は `any-hover` を使う（第16章）。'
  aiProne: true
  page: responsive/media-queries
  since: 0.4.0

- id: prefers-contrast-more-for-faint-borders
  level: 推奨
  rule: '薄い境界線や補助テキストの色で区別や意味を伝えている部品は、`@media (prefers-contrast: more)` の中で色を濃くする。'
  reason: OS でコントラストを上げる設定にしているユーザーが、薄い区切りや補助テキストを読み取れる状態を保つため。
  note: '`prefers-contrast: custom` は強制カラーモードの配色に対応する値で、色は上書きされるため指定しない。強制カラーモードの扱いは第14章で説明する。'
  page: responsive/media-queries
  since: 0.4.0

- id: reduced-transparency-opaque-background
  level: 推奨
  rule: '半透明の背景や `backdrop-filter` の上に文字を置く部品は、`@media (prefers-reduced-transparency: reduce)` の中で背景を不透明にする。'
  reason: OS で透明度を下げる設定にしているユーザーが、背景に左右されずに文字を読める状態を保つため。
  note: 2026年10月の時点で対応しているのは Chrome 系のブラウザだけです。半透明のままでもコントラストが足りる色を選んだうえで、追加の対策として書きます。
  page: responsive/media-queries
  since: 0.5.0

# 12-4 375px未満の画面ではビューポートを固定する
- id: fixed-viewport-below-min-width
  level: 推奨
  rule: '375px 未満の画面では、`<meta name="viewport">` の直後にインラインで置いたスクリプトで、`content` を `width=375` に書き換え、ビューポートの幅を固定する。'
  reason: 300px 前後の折りたたみ端末のような画面まで CSS で崩さずに組むのは実装の手間に見合わず、固定すれば表示全体が縮小されるだけで、レイアウトは崩れないため。
  note: '判定には `window.innerWidth` ではなく `window.outerWidth` を使います。`innerWidth` はビューポートを固定すると 375 になって元に戻れなくなり、ブラウザのズームでも小さくなります。`maximum-scale` や `user-scalable=no` は書き加えず、固定した後もズームできる状態を保ちます。外部ファイルにすると、読み込みを待つ間に狭いレイアウトで描画され、固定したときにレイアウトシフトが起きます。'
  aiProne: true
  page: responsive/min-viewport-width
  since: 0.18.0

# 12-5 カンプの幅で全体を拡大・縮小しない
- id: no-full-liquid-scaling
  level: 禁止
  rule: カンプの幅に対する比率で、ページ全体の文字サイズや余白を拡大・縮小しない（フルリキッドにしない）。
  reason: 1440px のカンプを幅 768px の画面に縮めると本文が約8.5px になるように、カンプの幅から離れるほど文字が読めなくなり、比率をビューポート単位から求めると文字サイズの設定やズームも効きにくくなるため。どの幅でも同じ配置を縮めるだけなので、画面に合わせて配置を変えるレスポンシブ対応にもならない。
  note: 'ブレイクポイントはデザインの段階で決めず、実装の段階でデザイナーと、保つもの（本文の読みやすさ、情報の量、画像の縦横比、CTA）と崩れとみなす基準（カラムの数を変える時点、余白を削る順番）をすり合わせて決めます（9-2）。コンポーネントの切り替えはコンテナクエリで、ビューポートに密着する要素とページ全体の段組みはメディアクエリで書き、幅で連続的に変えたい値は値ごとに `clamp()` で範囲を決めます（4-3）。'
  aiProne: true
  page: responsive/design-comp-pattern
  since: 0.18.0

- id: local-liquid-with-cqi
  level: 推奨
  rule: ヒーローのように幅に合わせて拡大・縮小させたい局所は、その部分を名前付きのコンテナにして `cqi` で組み、ビューポート単位を使わない。
  reason: 置かれた場所の幅に合わせて振る舞い、ページのほかの部分の文字サイズや余白を巻き込まないため。
  note: '文字サイズは、最小値と最大値を rem にし、推奨値を `cqi` と rem の和にした `clamp()` で書きます（`clamp-rem-bounds`）。`cqi` を使うのは、コンテナの子孫の要素だけです（`cqi-needs-named-container`）。'
  aiProne: true
  page: responsive/design-comp-pattern
  since: 0.18.0

# 12-6 セーフエリアに対応する
- id: safe-area-inset-with-viewport-fit-cover
  level: 必須
  rule: '`<meta name="viewport">` に `viewport-fit=cover` を指定したら、文字やボタンを `env(safe-area-inset-*)` で確保した範囲の内側に置き、上下左右と横向きの画面で確認する。'
  reason: '`cover` を指定するとブラウザはページをセーフエリアの内側に寄せなくなり、余白を書かないと、ノッチやホームインジケーターのある端末でだけ内容が隠れるため。'
  note: 画面の端まで描画する必要がないページでは、`viewport-fit` をデフォルトの `auto` のままにします。パソコンのブラウザではセーフエリアがすべて0なので、実機か iOS シミュレーターで確かめます。
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-combine-with-max
  level: 推奨
  rule: 'セーフエリアの値は単独で余白にせず、左右のガターや端に接するバーの余白は `max(16px, env(safe-area-inset-left))` のように通常の余白と比べ、端から浮かせる要素の位置は `calc(16px + env(safe-area-inset-bottom))` のように足す。'
  reason: セーフエリアの値は切り欠きやシステムの UI が占める幅そのもので、長方形の画面では0になるため。比べるか足すかは、余白の一部をセーフエリアで兼ねてよいかで決まる。
  note: '`env()` の第2引数は、ブラウザがその名前の環境変数を知らないときだけ使われます。`env(safe-area-inset-bottom, 16px)` と書いても、セーフエリアのない画面では16pxではなく0になります。'
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-background-to-edge
  level: 推奨
  rule: セーフエリアの余白は、背景を持つ要素の `padding` に入れ、背景は画面の端まで塗り、中身だけをセーフエリアの内側に寄せる。
  reason: '`viewport-fit=cover` を指定する目的は背景を端まで描くことで、`margin` や外側の要素の `padding` で空けると、背景が途切れた帯ができるため。'
  note: 'セクションの背景を端まで広げるなら、`body` ではなく、ページのレイアウトのガター（11-10 `primary-layout` など）にセーフエリアを入れます。'
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-fixed-bottom
  level: 必須
  rule: '画面の下端に `position: fixed` で固定するバーやボタンには、`env(safe-area-inset-bottom)` を加える。'
  reason: ホームインジケーターと重なり、ボタンを押すつもりの操作でホーム画面に戻ってしまうため。
  note: 横向きの画面では左右にもセーフエリアがあるので、左右の端に接するバーやボタンには `env(safe-area-inset-left)` と `env(safe-area-inset-right)` も加えます。対象のブラウザはすべて `env()` に対応しているので、固定の値の宣言を前に書く二段構えのフォールバックは書きません。
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0
