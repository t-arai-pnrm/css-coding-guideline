# 第8章 レイアウト

# 8-1 レイアウトの基礎
- id: identify-layout-mode-first
  level: 推奨
  rule: 配置が思いどおりにならないときは、値を足したり `position` でずらしたりする前に、その要素がどのレイアウトの方式（通常フロー、Flexbox、Grid、位置指定）の中にあり、どの要素が包含ブロックとスタッキングコンテキストになっているかを確かめる。
  reason: 効かない指定の多くは、その方式の規則どおりの振る舞いで、値を足して見た目を合わせても原因が残り、内容や文字の大きさが変わったときに崩れるため。
  aiProne: true
  page: layout/fundamentals
  since: 0.5.0

- id: no-inline-block-for-rows
  level: 非推奨
  rule: '要素を横に並べるために `display: inline-block`（`inline flow-root`）を使わず、親を Flexbox か Grid にして `gap` で間隔を決める。'
  reason: タグの間の改行や空白が匿名のインラインボックスになり、親の `font-size` で幅の変わる隙間が要素の間に入るため。
  note: '`inline flow-root` は、文中のインライン要素に上下の余白や幅を持たせたいときに使います。'
  aiProne: true
  page: layout/normal-flow
  since: 0.5.0

# 8-2 通常フローの基礎
- id: no-flex-grid-props-in-flow
  level: 非推奨
  rule: '`gap`、`align-items`、`justify-content` のように Flexbox や Grid でだけ働くプロパティを、`display` が `flex` でも `grid` でもない通常フローの要素に書かない。'
  reason: 通常フローのブロックコンテナではこれらのプロパティは何も変えず、書いてあると間隔や配置がそこで決まっていると読まれて、実際の指定（子の `margin` など）を見誤らせるため。
  note: '`align-content` は、ブロックコンテナでも中身をブロック方向にそろえるので、この対象から外れます。`gap` は段組み（`column-count` など）でも働きます。'
  aiProne: true
  page: layout/normal-flow
  since: 0.12.0

# 8-3 ボックスモデルの基礎
- id: box-sizing-border-box-base
  level: 推奨
  rule: '`box-sizing` はベーススタイル（kiso.css）の全称セレクタで `border-box` にそろえ、コンポーネントで `box-sizing: border-box` を書き足さない。'
  reason: '`inline-size` に指定した値が `border` までを含んだ幅になり、`padding` や `border` を変えても幅の計算を直さずに済むため。全称セレクタで指定済みなら、コンポーネントでの指定は何も変えない。'
  note: '内容の幅を固定したい要素（`max-inline-size` で本文の幅を決め、左右の `padding` だけを変えたい要素など）に限り、`box-sizing: content-box` に戻します。'
  aiProne: true
  page: layout/box-model
  since: 0.5.0

- id: box-fit-content-over-display-change
  level: 推奨
  rule: '要素の幅を中身に合わせるときは、`display: inline-block` や `float` に変えず、`inline-size: fit-content` を指定する。'
  reason: '`display` や `float` を変えると、前後の文字と同じ行に並ぶ、ベースラインにそろうといった外側の振る舞いまで変わるが、`fit-content` ならブロックのまま幅だけが変わるため。'
  note: '親より長い中身は、`fit-content` なら親の幅で折り返します。折り返させたくない場合だけ `max-content` を使います。'
  aiProne: true
  page: layout/box-model
  since: 0.5.0

- id: box-state-border-without-shift
  level: 推奨
  rule: 'ホバーや選択などの状態で枠線を足すときは、`border-width` を変えず、同じ太さの透明な `border` を最初から置いて色だけを変えるか、`outline` か `box-shadow` で描く。'
  reason: '`border` はボックスの大きさに含まれ、状態によって太さが変わると要素が広がって周りの要素が押し出されるが、`outline` と `box-shadow` は大きさに含まれないため。'
  note: '枠線を消すときに `border: none` ではなく `border-color: transparent` にする理由は、第11章の `transparent-border-over-none` を参照してください。'
  aiProne: true
  page: layout/box-model
  since: 0.5.0

# 8-4 マージンの相殺
- id: margin-collapse-padding-for-inner-space
  level: 推奨
  rule: 親の背景や枠線の内側に余白を取るときは、最初の子の `margin-block-start` や最後の子の `margin-block-end` ではなく、親の `padding-block` で作る。
  reason: 通常フローでは、親に `padding` や `border` がないと子の `margin` が親の `margin` と相殺して親の外へ出て、背景の外に余白ができるため。
  note: 'コンポーネントのルートに外側の `margin` を持たせない方針（第7章）も、子の `margin` が外へ出ると守れなくなります。相殺そのものを止めたいときは、親に `display: block flow-root` を指定します（ルール `flow-root-for-margin-collapse`）。'
  aiProne: true
  page: layout/margin-collapse
  since: 0.5.0

- id: margin-collapse-no-empty-spacers
  level: 非推奨
  rule: '余白を作るために、空の要素、`<br>`、`<p>&nbsp;</p>` を置かない。'
  reason: '中身のない要素は上下の `margin` が相殺して通り抜けるので余白にならず、`&nbsp;` や `<br>` の行は行の高さで余白が決まり、文字の大きさで変わるため。'
  note: 余白は、前後の要素の `margin` か、親の `gap` や `grid-template` で作ります。CMS の本文に入った空の段落は、通常フローでは相殺で消えますが、`gap` で並べた領域では `gap` の2つ分の間隔になります。
  page: layout/margin-collapse
  since: 0.5.0

# 8-5 Flexboxの基礎
- id: flexbox-basis-zero-for-ratio
  level: 推奨
  rule: 'Flexbox のアイテムを中身にかかわらず比率で分けるときは `flex: 1` のように `flex-basis` も0にし、中身の大きさに余りを足して伸ばすときは `flex-grow` だけを指定して、2つを区別する。'
  reason: '`flex-grow` は `flex-basis` を除いた余りだけを配るので、`flex-basis` が `auto` のままだと中身の大きさの差が残り、同じ値を指定しても同じ幅にならないため。'
  note: '`flex: 1` は `1 1 0` に展開されます。`flex: 1` を `flex-grow: 1` に書き換えると動きが変わります（第1章のルール `longhand-for-partial-change`）。列の幅を厳密にそろえるなら、Grid で列を決めます。'
  aiProne: true
  page: layout/flexbox-basics
  since: 0.5.0

- id: flexbox-check-auto-min-size
  level: 推奨
  rule: 'フレックスアイテムが縮まずにはみ出すときは、固定の幅を足したり `overflow: hidden` で隠したりする前に、自動の最小幅（`min-inline-size: auto`）が中身の最小幅になっていないかを確かめる。'
  reason: 'フレックスアイテムの `min-inline-size: auto` は中身の最小幅（`min-content`）として扱われ、`flex-shrink` で縮む量を計算してもそれより小さくならないため。`overflow: hidden` でも最小幅は0になるが、中身を切り取って隠すだけになる。'
  note: '本書のベーススタイルでは、全称セレクタの `min-inline-size: 0`（第5章のルール `global-min-inline-size-zero`）で前もって防いでいます。`flex-direction: column` のコンテナでは、同じことが `min-block-size` で起きます。'
  aiProne: true
  page: layout/flexbox-basics
  since: 0.5.0

- id: flexbox-no-visual-reorder
  level: 非推奨
  rule: 'フォーカスできる要素や、順番に意味のある要素を並べた Flexbox で、`order` や `row-reverse`・`column-reverse` によって見た目の順番を入れ替えない。'
  reason: 読み上げの順番とキーボードでフォーカスが移る順番は HTML の順番のままなので、見た目の順番と食い違うため。
  note: 順番に意味がなく、フォーカスできる要素も含まない並び（装飾の画像と本文など）は対象外です。見た目の順番に合わせてフォーカスを移す `reading-flow` は、2026年10月の時点で Baseline ではありません。それでも並べ替えるときは、ルール `reading-flow-when-reordered` に従って `reading-flow` を指定します。
  aiProne: true
  page: layout/flexbox-basics
  since: 0.5.0

# 8-6 Gridの基礎
- id: grid-auto-rows-for-item-count
  level: 推奨
  rule: アイテムの数で行数が変わるグリッドでは、`grid-template-rows` で行を決めず、`grid-auto-rows` で暗黙の行の大きさを決める。
  reason: 明示的な行の数を超えたアイテムは暗黙の行に入り、`grid-template-rows` の大きさが当てはまらず、行の高さが途中から変わるため。
  note: '暗黙の行の大きさの初期値は `auto`（中身の大きさ）です。列の方向に足していく `grid-auto-flow: column` では、`grid-auto-columns` で決めます。'
  aiProne: true
  page: layout/grid-basics
  since: 0.5.0

- id: grid-negative-lines-explicit-only
  level: 非推奨
  rule: '暗黙の行や列が作られるグリッドで、アイテムを最後まで届かせるために `-1` などの負の線番号を使わない。'
  reason: 負の線番号は明示的なグリッドの終わりから数え、暗黙のトラックを数に入れないので、アイテムが途中のトラックで止まるため。
  note: '列を明示的に決めたグリッドで、端から端までまたがらせる `grid-column: 1 / -1` は使えます。明示的な行がないグリッドの `grid-row: 1 / -1` は、1行分にしかまたがりません。'
  aiProne: true
  page: layout/grid-basics
  since: 0.5.0

- id: grid-named-lines-for-placement
  level: 推奨
  rule: 意味のある位置にアイテムを置くときは、線の番号ではなく、`--` で始まる線の名前かエリアの名前で指定する。
  reason: トラックを足したり減らしたりしてもアイテムの指定を直さずに済み、どの位置に置くのかがコードから読み取れるため。
  note: '`--content-start` と `--content-end` の組を付けると、`grid-column: --content` で置けます。名前を書き間違えるとエラーにならず、アイテムが明示的なグリッドの外に置かれます。端から端までの `1 / -1` や、数でまたがる `span 2` は番号のままでかまいません。名前の付け方は第6章のルール `dashed-ident-names` で扱います。'
  page: layout/grid-basics
  since: 0.5.0

# 8-7 positionの基礎
- id: containing-block-inside-component
  level: 推奨
  rule: '`position: absolute` の要素の基準にする祖先には、同じコンポーネントの中で `position: relative` を指定する。'
  reason: 基準がコンポーネントの外の祖先に決まると、置く場所によって位置が変わるため。
  page: layout/positioning
  since: 0.1.0

- id: absolute-centering-with-margin-auto
  level: 推奨
  rule: '絶対配置の要素を中央に置くときは、`translate: -50% -50%` ではなく、`inset: 0` と `margin: auto` を使う。'
  reason: 位置を決める指定が `inset` と `margin` にまとまり、変形のプロパティを配置のために使わずに済むため。
  note: '`inset: 0` だけでは親いっぱいに広がるので、`inline-size` と `block-size`（`fit-content` など）で大きさを決めます。グリッドやフレックスの中なら、`place-items: center` で足ります。絶対配置にする必要のない通常のブロックなら、縦方向は `align-content: center` で足ります。'
  aiProne: true
  page: layout/positioning
  since: 0.1.0

- id: no-fixed-inside-transformed-ancestor
  level: 非推奨
  rule: '`position: fixed` の要素を、`transform`、`filter`、`contain` などを指定した祖先の中に置かない。'
  reason: これらの祖先が包含ブロックになり、要素がビューポートではなくその祖先を基準に配置されるため。
  note: '個別の変形プロパティ（`translate` など）、`backdrop-filter`、`perspective`、`content-visibility: auto` と、これらを書いた `will-change` も包含ブロックを作ります。モーダルは、`<dialog>` の `showModal()` でトップレイヤーに表示します（第13章）。'
  page: layout/positioning
  since: 0.1.0

- id: sticky-align-self-start
  level: 必須
  rule: 'Grid や Flexbox の子に `position: sticky` を指定するときは、その要素に `align-self: start` を指定する。'
  reason: '`align-self` の初期値では要素が行の高さいっぱいに伸び、包含ブロックの中でずらす余地がなくなるため。'
  note: '親の `align-items: start` でも同じ結果になりますが、ほかの子の高さも変わります。'
  aiProne: true
  page: layout/positioning
  since: 0.4.0

- id: sticky-needs-inset
  level: 必須
  rule: '`position: sticky` には、留めたい軸の `inset-block-start` などの inset を、`auto` 以外の値で1つ以上指定する。'
  reason: 指定がないと、その軸では留まる位置が決まらず、`relative` と同じ動きになるため。
  page: layout/positioning
  since: 0.4.0

- id: sticky-cap-block-size
  level: 推奨
  rule: '画面より高くなりうる `sticky` の要素には、`max-block-size` と `overflow-y: auto` を指定する。'
  reason: 要素が画面より高いと、下端が見えないまま上端で留まり、末尾に届かなくなるため。
  note: '上限は、`calc(100svb - 16px * 2)` のように、スクロールで値が変わらない `svb` から余白を引いて決めます。'
  page: layout/positioning
  since: 0.4.0

- id: scroll-state-for-sticky-styles
  level: 推奨
  rule: '`sticky` の要素が留まっている間だけ見た目を変えるときは、`scroll` イベントではなく `container-type: scroll-state` と `@container scroll-state(stuck: …)` を使い、変える内容は見えなくても操作に困らない装飾に限る。'
  reason: スクロールのたびに JavaScript で位置を調べる処理が要らなくなり、クエリに対応していない環境でも装飾が付かないだけで済むため。
  note: 'コンテナクエリなので、変えられるのはコンテナの子孫だけです。2026年10月の時点で対応しているのは Chrome 系のブラウザだけです。'
  aiProne: true
  page: layout/positioning
  since: 0.5.0

- id: sticky-header-height-query
  level: 推奨
  rule: 'ヘッダーを固定するときは、`@media (height >= calc(600 / 16 * 1rem))` のように、ビューポートの高さが十分なときだけ固定する。'
  reason: 高さの低い画面や拡大した画面では、固定したヘッダーが画面の多くを覆い、フォーカスした要素も隠すため。
  note: 'ヘッダーの高さが決まっているなら、同じ条件でルートに `scroll-padding-block-start` を指定し、スクロールで見せる範囲からヘッダーの分を除きます。閾値の600px相当は目安です。'
  aiProne: true
  page: layout/positioning
  since: 0.3.0

- id: anchor-scope-for-repeated-components
  level: 推奨
  rule: 繰り返し置くコンポーネントの中でアンカーポジショニングを使うときは、ルートに `anchor-scope` を指定して、アンカーの名前が届く範囲をコンポーネントの中に限る。
  reason: 同じ名前のアンカーが複数あると、別のコンポーネントのアンカーが基準に選ばれることがあるため。
  note: アンカーポジショニングをレイアウトの要として使わない規則は、第1章のルール `no-unsupported-layout-features` で扱います。
  page: layout/positioning
  since: 0.1.0

- id: implicit-anchor-first
  level: 推奨
  rule: ポップオーバーを開くボタンを基準に配置するときは、`anchor-name` で名前を付けず、`popovertarget` や `commandfor` による暗黙のアンカーを使う。
  reason: アンカーが要素どうしの結び付きで決まるので、名前が衝突せず、`anchor-scope` も要らないため。
  note: '暗黙のアンカーを `anchor()` で使うときは、`position-anchor: auto` を明示します。初期値の `normal` は、`position-area` を指定したときだけ暗黙のアンカーを使います。'
  aiProne: true
  page: layout/positioning
  since: 0.3.0

- id: position-area-logical-keywords
  level: 推奨
  rule: '`position-area` の値は、`bottom right` のような物理キーワードではなく、`block-end span-inline-end` のような論理キーワードで書く。'
  reason: 縦書きや右から左へ書く言語でも、文の流れに対して同じ側に表示され、論理プロパティとも書き方がそろうため。
  note: 論理プロパティを使う規則は、第6章のルール `logical-properties` で扱います。
  aiProne: true
  page: layout/positioning
  since: 0.3.0

- id: overlap-detection-for-decoration-only
  level: 推奨
  rule: 'アンカーポジショニングとスクロール駆動アニメーションで要素どうしの重なりを検出する技法は、隠れても内容と操作に影響しない装飾にだけ使い、指定はすべて `@supports` の中に書く。'
  reason: 'Firefox などの未対応の環境では検出が働かないので、隠す対象が本文や操作の部品だと、環境によって読める内容が変わるため。'
  note: '測る範囲に置く要素は、はみ出したときにスクロールコンテナになるので、`inert` 属性を付けてフォーカスと支援技術から外します。重ならないレイアウト（Grid の列に装飾を置くなど）を組めるなら、そちらを先に検討します。'
  page: layout/positioning
  since: 0.12.0

# 8-8 Gridから考える
- id: grid-template-first
  level: 推奨
  rule: レイアウトを組むときは、まず親の `grid-template` で子要素の配置と大きさを決められないかを検討する。
  reason: 配置が親の指定だけで完結し、子要素の側に幅の計算や個別の指定を書かずに済むため。
  note: 「1次元なら Flexbox、2次元なら Grid」という分け方は正確ではありません。1列や1行の並びでも、Grid のほうが簡潔に書ける場面は多くあります。
  aiProne: true
  page: layout/grid-first
  since: 0.1.0

- id: flexbox-for-content-sized-items
  level: 推奨
  rule: タグやメニューのように、中身の量で幅が決まる要素を並べて折り返すときは、Flexbox を使う。
  reason: 子要素の幅を決めずに並べられ、入りきらない要素は自動で次の行へ回るため。
  page: layout/grid-first
  since: 0.1.0

- id: grid-areas-for-changing-structure
  level: 推奨
  rule: 幅や中身によって配置の構造が変わるレイアウトは、`grid-template` のエリアで書き、条件ごとにテンプレートだけを書き換える。
  reason: 配置の変化が1か所にまとまり、子要素ごとに条件を書かずに済むため。
  note: エリアの名前を `--` で始める規則は、第6章のルール `dashed-ident-names` で扱います。
  page: layout/grid-first
  since: 0.1.0

- id: grid-area-names-match-children
  level: 推奨
  rule: グリッドのエリアの名前は、そのエリアに置く子要素のクラス名とそろえる（`._image` を置くエリアは `--image`）。
  reason: '`grid-template` の図と、各要素の `grid-area` の対応をすぐに読み取れるため。'
  page: layout/grid-first
  since: 0.1.0

- id: source-order-for-reading
  level: 推奨
  rule: HTML は見た目の順番ではなく文書構造の順番（見出しから）で書き、見た目の順番が違うときは Grid の配置で入れ替える。
  reason: スクリーンリーダーの読み上げや、CSS が効かない環境でも、内容が意味の通る順番で伝わるため。
  note: フォーカスできる要素の順番を入れ替えると、キーボードで移動する順番が見た目と食い違います。Grid の配置で入れ替えるときは、同じルールに `reading-flow` を指定します（ルール `reading-flow-when-reordered`）。`reading-flow` は2026年10月の時点で Chrome と Edge の137以降だけが対応しているので、HTML の順番を直す代わりには使いません。
  page: layout/grid-first
  since: 0.1.0

- id: subgrid-for-aligned-rows
  level: 推奨
  rule: 並べたカードの中の見出し、本文、ボタンの位置をそろえるときは、固定の高さや JavaScript ではなく、サブグリッドを使う。
  reason: 中身の量が変わっても、同じ行にある要素の高さが自動でそろうため。
  note: '`flex-direction: column` と `flex-grow` の組み合わせでは、そろえられるのは1か所だけです。'
  aiProne: true
  page: layout/grid-first
  since: 0.1.0

- id: subgrid-span-rows
  level: 必須
  rule: '`grid-template-rows: subgrid` を指定した要素には、中の要素の数と同じ行数を `grid-row: span N` で指定する。'
  reason: 指定しないと、サブグリッドが親の1行分にしかまたがらず、中の要素がすべて同じ1行に押し込まれるため。
  page: layout/grid-first
  since: 0.1.0

- id: column-width-by-variability
  level: 推奨
  rule: 'グリッドの列の幅は、列ごとに可変か不変かを決めてから、`max-content`（改行させない）、`fit-content()`（上限まで中身に合わせる）、`minmax(0, 1fr)`（残りをすべて使う）のように指定する。'
  reason: 中身の長さが変わっても、どの列が伸び、どの列が伸びないかがコードから読み取れ、意図どおりに振る舞うため。
  note: '一覧の項目は `grid-template-columns: subgrid` で親の列に参加させると、すべての項目で列の位置がそろいます。'
  page: layout/grid-first
  since: 0.3.0

- id: flex-auto-margin-for-end-items
  level: 推奨
  rule: 'Flexbox の並びで一部の要素だけを行末側へ寄せるときは、その要素に `margin-inline-start: auto` を指定し、空の要素や `flex-grow` を使わない。'
  reason: 余白の吸収先が1か所に決まり、要素の数が変わっても、寄せる位置が変わらないため。
  note: '均等に散らす `justify-content: space-between` は、寄せる位置が要素の数で変わるので、この用途には向きません。'
  page: layout/grid-first
  since: 0.4.0

- id: no-dense-for-ordered-items
  level: 非推奨
  rule: '順序に意味のある要素（フォーカスできる要素、手順、ランキング）を並べた Grid に、`grid-auto-flow: dense` を指定しない。'
  reason: 見た目の順番だけが入れ替わり、キーボードで移動する順番や読み上げの順番と食い違うため。
  note: タグやサムネイルの一覧のように、順序に意味のない並びには使えます。
  aiProne: true
  page: layout/grid-first
  since: 0.4.0

- id: display-contents-keep-role
  level: 推奨
  rule: 'サブグリッドのために `display: contents` で箱をなくす要素は、ロールを持たない `div` に限るか、`role` 属性でロールを明示して読み上げを確かめる。'
  reason: '`display: contents` を指定した要素は、ブラウザによっては見出しやリストなどの暗黙のロールが失われることがあるため。'
  page: layout/grid-first
  since: 0.1.0

- id: float-for-text-wrap
  level: 推奨
  rule: '画像のまわりに文字を回り込ませるときは `float` を使い、囲む要素には clearfix ではなく `display: flow-root` を指定する。'
  reason: 回り込みは `float` の本来の用途で、`flow-root` なら余計な擬似要素なしに `float` を内側に収められるため。
  note: '値は `float: inline-end` のように論理値で書きます。'
  page: layout/grid-first
  since: 0.1.0

# 8-9 余白を設計する
- id: gap-over-child-margin
  level: 推奨
  rule: Flexbox や Grid の子要素の間隔は、子要素の `margin` ではなく、親の `gap` で作る。
  reason: 端の要素の余白を打ち消す指定が要らず、折り返したときに行の頭へ余計な余白が残ることもないため。
  aiProne: true
  page: layout/spacing
  since: 0.1.0

- id: empty-grid-cells-for-spacing
  level: 推奨
  rule: 要素の間ごとに大きさの違う余白は、`grid-template` に空のセル（`.`）の行や列を置いて作る。
  reason: 余白の指定が `grid-template` の1か所にまとまり、見れば構造が分かるうえ、余白のための要素を足さずに済むため。
  note: 余白の差を作るためだけに、`padding` を持つ `div` を足しません。
  page: layout/spacing
  since: 0.1.0

- id: owl-margin-for-optional-elements
  level: 推奨
  rule: 状況によって要素の有無や数が変わる場所では、`* + *` で2つ目以降の要素にだけ `margin-block-start` を付けて間隔を作る。
  reason: 空のセルで余白を決めておくと、要素が欠けたときに余白だけが残るため。
  page: layout/spacing
  since: 0.1.0

- id: prose-in-normal-flow
  level: 推奨
  rule: 本文のように種類の違う要素が続く領域は、Flexbox や Grid の `gap` にせず、通常フローのまま `margin` で間隔を作る。
  reason: '`float` による回り込みや `margin` の相殺が働き、要素ごとの余白の大小を自然に調整できるため。'
  page: layout/spacing
  since: 0.1.0

- id: flow-root-for-margin-collapse
  level: 推奨
  rule: '親子のマージンの相殺を止めたいときは、`overflow: auto` や見えない `padding`、`border` ではなく、親に `display: flow-root` を指定する。'
  reason: '`overflow` はスクロールコンテナを作り、中の `position: sticky` を妨げるほか、影や絶対配置の要素を切り取る副作用があるため。'
  note: 'Flexbox や Grid にした親と、その子の間では、余白は相殺しません。'
  page: layout/spacing
  since: 0.4.0

- id: gutter-columns-for-content-width
  level: 推奨
  rule: ページのコンテンツの最大幅と画面の端の余白は、グリッドの左右に余白の列（ガター）を作って決める。
  reason: 画面幅いっぱいに広げたい要素を、ガターの列まで広げるだけで作れるため。
  note: 第7章のコンポジション `primary-layout` は、この形を部品にしたものです。
  page: layout/spacing
  since: 0.1.0

- id: section-padding-block
  level: 推奨
  rule: ページに縦に並べるセクションの上下の余白は、親の `gap` やセクションの外側の `margin` ではなく、各セクションのルートの `padding-block` で作る。
  reason: 背景は `margin` の領域や親の `gap` の部分には描かれないため、`gap` や `margin` で空けるとセクションの間に親の背景が帯のように見えるため。`padding-block` なら背景が途切れず、中身と背景の端の間にも余白が確保される。
  note: 背景が同じセクションが続く箇所では、`padding` は相殺しないので、上下のセクションの値が足し合わされます。
  page: layout/spacing
  since: 0.13.0

- id: spacing-proximity
  level: 推奨
  rule: 余白の大きさは、グループの間の余白をグループの中の余白より大きくして、要素のまとまりが見て分かるようにする。
  reason: 人は近くにあるものを同じまとまりとして読み取るので、余白の差が小さいと、どの要素がどのグループに属するのかが分からなくなるため。
  note: カードの一覧なら、カードの中の間隔より、カードとカードの間隔を大きくします。
  page: layout/spacing
  since: 0.3.0

# 8-10 変化に強いレイアウト
- id: design-for-content-changes
  level: 推奨
  rule: CSS を書くときは、テキストが2倍の長さになったら、画像がなかったら、要素の数が変わったらと考え、そのパターンで表示を確かめる。
  reason: CMS での更新や改修によって、デザインカンプにない内容が入ることは避けられないため。
  page: layout/defensive
  since: 0.1.0

- id: minmax-min-capped-at-100-percent
  level: 必須
  rule: '`minmax()` の最小値や `min-inline-size` に固定の長さを書くときは、`min(100%, …)` で親の幅を上限にする。'
  reason: 親がその長さより狭くなったときに、はみ出すのを防ぐため。
  note: '例：`repeat(auto-fit, minmax(min(100%, calc(360 / 16 * 1rem)), 1fr))`、`min-inline-size: min(100%, 320px)`。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: minmax-zero-for-fr
  level: 推奨
  rule: 列を均等や比率で分けるときは、`1fr` ではなく `minmax(0, 1fr)` と書く。
  reason: '`1fr` の最小値は中身の最小幅になり、長い URL や入力欄が列を押し広げるため。'
  note: '列を比率で分けるときに `%` を使わない理由は、`%` が `gap` を除かない親の幅を基準にし、列の合計が `gap` の分だけ親を超えるためです。`fr` は `gap` を除いた残りを分けます。全称セレクタの `min-inline-size: 0`（第5章のルール `global-min-inline-size-zero`）でも防げますが、トラックの側で最小値を決めておけば、グローバルの指定に頼らずに済みます。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: flex-wrap-for-variable-items
  level: 推奨
  rule: '要素の数が変わる可能性のある Flexbox には、`flex-wrap: wrap` を指定する。'
  reason: 要素が増えたときや画面が狭いときに、折り返せずにはみ出すのを防ぐため。
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: fit-content-over-flex-shrink-zero
  level: 推奨
  rule: '文字を含む flex アイテムが縮みすぎないようにするときは、`flex-shrink: 0` ではなく `min-inline-size: fit-content` を使う。'
  reason: '`flex-shrink: 0` の要素は親より長くても縮まずにはみ出すが、`fit-content` なら親の幅を超えるときだけ折り返すため。'
  note: 'アイコンのように、大きさを変えたくない要素には `flex-shrink: 0` を指定します。'
  page: layout/defensive
  since: 0.1.0

- id: no-nowrap-without-reason
  level: 非推奨
  rule: '明確な理由がない限り、`white-space: nowrap` を指定しない。'
  reason: 内容が長くなったときや画面が狭いときに、折り返せずにはみ出すため。
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: find-overflow-source-first
  level: 推奨
  rule: 横スクロールが起きたら、はみ出しを隠す前に、はみ出している要素を特定して原因を直す。
  reason: 隠すだけでは、はみ出した内容が切れて読めなくなることがあり、同じ原因の不具合がほかの場所でも残るため。
  page: layout/defensive
  since: 0.1.0

- id: overflow-clip-over-hidden
  level: 必須
  rule: 'はみ出しを切り取るだけなら、`overflow: hidden`（`overflow-x: hidden`）ではなく `clip` を使う。'
  reason: '`hidden` は要素をスクロールコンテナにするので、中の `position: sticky` が効かなくなるため。'
  note: '`contain: paint` も、中の `position: fixed` の基準を変えてしまうので、はみ出しの対策には使いません。`sticky` が動かない原因の切り分けは、8-7 を参照してください。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: safe-center-for-scrollable
  level: 推奨
  rule: 'スクロールさせる要素の中身を `justify-content` や `align-content` で中央に寄せるときは、`safe center` と書く。'
  reason: '`center` のままでは、中身がはみ出したときに先頭側がスクロールで戻れない位置に置かれ、読めなくなるため。'
  aiProne: true
  page: layout/defensive
  since: 0.5.0

# 8-11 重なりと全幅
- id: grid-stack-before-absolute
  level: 推奨
  rule: '要素を重ねるときは、`position: absolute` の前に、Grid の同じエリアに置く方法を検討する。'
  reason: 重ねたどの要素の大きさも親の高さに反映されるので、文字が増えても画像からはみ出さないため。
  note: 第8章のコンポジション `pile` は、この形を部品にしたものです。
  aiProne: true
  page: layout/layering
  since: 0.1.0

- id: check-stacking-context-first
  level: 推奨
  rule: 重なり順がおかしいときは、z-index の値を大きくする前に、どのスタッキングコンテキストの中で比べられているかを確かめる。
  reason: z-index は同じスタッキングコンテキストの中でしか比べられず、祖先のコンテキストの順位を超えられないため。
  note: '不要なコンテキストは指定を外して消し、必要なものは `isolation: isolate` で意図して作ります。`html` 要素は最初からコンテキストを作ります。z-index の値の決め方と `isolation` は、第7章のルール `z-index-tokens-only`、`isolation-for-relative-z-index` で扱います。'
  aiProne: true
  page: layout/layering
  since: 0.1.0

- id: z-index-on-items-without-position
  level: 推奨
  rule: 'Flexbox と Grid の子の重なり順を変えるだけなら、`position: relative` を足さずに z-index を指定する。'
  reason: 'フレックスアイテムとグリッドアイテムには `position: static` のままでも z-index が効き、`position: relative` を足すと、子孫の絶対配置の要素の包含ブロックまで変わるため。'
  note: '通常フローの要素では、z-index を効かせるのに `static` 以外の `position` が要ります。'
  aiProne: true
  page: layout/layering
  since: 0.12.0

- id: full-bleed-via-layout-first
  level: 推奨
  rule: 要素を画面幅いっぱいに広げるときは、まずレイアウトのガターの列まで広げる方法を使い、ビューポート単位で広げるのは、背景の装飾と横にスクロールする領域に限る。
  reason: ビューポート単位はスクロールバーの幅の扱いがブラウザによって異なり、横スクロールの原因になりやすいため。
  page: layout/layering
  since: 0.1.0

- id: full-bleed-offset-formula
  level: 必須
  rule: 親の幅を超えて画面の端まで広げる量は、`calc((100lvi - 100%) / -2)` のように「画面の幅と親の幅の差の半分」の式で書き、`100vw` や `calc(50% - 50vw)` を使わない。
  reason: 何をどれだけ広げているのかが式から読め、`vw` の曖昧さも避けられるため。
  note: '横にスクロールする領域では、`100%` の代わりに名前付きのコンテナの `100cqi` を使います。`vw` を使わない理由は、第4章のルール `no-vw-vh` を参照してください。'
  aiProne: true
  page: layout/layering
  since: 0.1.0

# 8-12 ページのスクロールとルートスクローラー
- id: root-scroller-for-page-scroll
  level: 推奨
  rule: 'ページ全体のスクロールはビューポート（ルートスクローラー）に任せ、`html`、`body`、ページ全体を包むラッパーをスクロールコンテナにしない。'
  reason: '戻ったときのスクロール位置の復元、キーボードでのスクロール、`window.scrollY` とスクロールのイベント、ルートに書いた `scroll-padding` や背面の固定など、ページのスクロールを前提にした機能が働かなくなるため。'
  note: '表やコードブロックのように、ページの一部だけをスクロールさせる要素は対象外です。ページがどこでスクロールしているかは、スクロールしてから `window.scrollY` が0のままでないかで確かめます。'
  aiProne: true
  page: layout/root-scroller
  since: 0.5.0

- id: root-scroller-no-fixed-root-height
  level: 非推奨
  rule: '`html` と `body` に `height: 100%` を指定しない。画面の高さが必要なら、ページのレイアウトの要素に `min-block-size: 100svb` で最小値を決める。'
  reason: '高さを固定すると内容があふれ、あふれた分のための `overflow` が入れ子のスクロールコンテナを作るため。`overflow-x: hidden` と組み合わせると、`body` がスクロールコンテナになる。'
  note: 'kiso.css は `body` に `min-block-size: 100dvb` を指定しています。`body` の直下の要素には `%` の高さが効かないので、その要素にも `100svb` を指定します。'
  aiProne: true
  page: layout/root-scroller
  since: 0.5.0

- id: root-scroller-sticky-instead-of-pane
  level: 推奨
  rule: '画面に残したいヘッダーやサイドバーは、本文だけをスクロールさせる構造ではなく、`position: sticky` で留める。'
  reason: 'ページ全体がビューポートでスクロールしたまま、留めたい要素だけが位置を保てるため。'
  note: 'ヘッダーは、ビューポートの高さが十分なときだけ留めます（8-7）。'
  page: layout/root-scroller
  since: 0.5.0

# 8-13 grid-lanesで石積みのレイアウトを組む
- id: grid-lanes-inside-supports
  level: 推奨
  rule: '`display: block grid-lanes` は `@supports (display: block grid-lanes)` の中に書き、その外には通常の Grid（`display: block grid`）と同じ `grid-template-columns` を書く。'
  reason: 未対応の環境では行の高さがそろった Grid として読めて操作でき、分岐の条件がコードに残るので、全ブラウザが対応した時点で検索して消せるため。
  note: '`display` を2つ並べて後の宣言の無効化に頼る書き方は、意図が読めず、重複として消されやすいので使いません。写真を正方形にそろえるなど、フォールバックだけの宣言を切り替えるときも、各要素の中の `@supports` に書きます。`display` は、ほかの値と同じく `block grid-lanes` の2値構文で書きます。'
  aiProne: true
  page: layout/masonry
  since: 0.5.0

- id: grid-lanes-no-placement-for-ordered-items
  level: 非推奨
  rule: '`grid-lanes` で順序に意味のある項目を並べるときは、項目に `grid-column: span N` や線の番号による配置を指定しない。'
  reason: 複数の列にまたがる項目や、位置を決めた項目が空きを作り、後の項目が前に表示されて、読み上げやフォーカスの順番と見た目の順番が大きく食い違うため。
  note: ランキングや手順のように、順番そのものが内容になる一覧には `grid-lanes` を使いません。
  page: layout/masonry
  since: 0.5.0

- id: flow-tolerance-no-infinite
  level: 非推奨
  rule: '`flow-tolerance` に `infinite` を指定しない。並び順を優先したいときは、`3em` のように初期値（`1em`）より大きい長さを指定する。'
  reason: '`infinite` は列の高さを無視して左から順に置くので、隣り合う項目が縦に大きく離れた位置に置かれ、読み手が順番を追えなくなるため。'
  note: 仕様も、`infinite` の代わりに大きめの長さを指定するよう勧めています。
  page: layout/masonry
  since: 0.5.0

- id: columns-for-top-to-bottom-lists
  level: 推奨
  rule: '上から下へ読む1つのリストを段に分けるときは `columns` を使い、項目に `break-inside: avoid` を指定して、間隔は `margin` ではなく `padding-block` で空ける。'
  reason: 段組みは並び順が縦なので HTML の順番と読む順番がそろい、2段目以降の先頭の `margin` は段の境目で切り取られて上端がそろわないため。
  note: '`column-width` は `%` を受け付けず、`min(100%, …)` と書くと宣言ごと無効になります。段の幅をコンテナに比例させるときは `cqi` を使います。横方向の順番で並べながら高さの違いを詰めるなら `grid-lanes` を使います。'
  aiProne: true
  page: layout/masonry
  since: 0.5.0

# 8-14-1 stack：子要素を縦に積み、間隔をそろえる
- id: stack-vs-prose
  level: 推奨
  rule: 同じ役割の要素を同じ間隔で縦に積むときは `stack` を、見出しや段落、図が続く本文の流れには `prose` を使う。
  reason: '`stack` の子はフレックスアイテムになり、`float` による回り込みと `margin` の相殺が使えず、間隔も子ごとに変えられないため。'
  note: "横に並べるときは、`stack` に `flex-direction: row` を上書きせず、`cluster` や `apart` を使います。CMS で編集者が入力する本文エリアの中には、どちらも使わず `.wysiwyg` で余白を決めます（`prose-not-on-cms-body`）。"
  aiProne: true
  page: layout/compositions/stack
  since: 0.5.0

- id: stack-uneven-gaps
  level: 推奨
  rule: '`stack` の一部の間隔だけを変えたいときは、子に `margin` を足さず、近い要素を `stack` で包んで入れ子にするか、`grid-template` の空のセルに切り替える。'
  reason: フレックスアイテムの `margin` は相殺されずに `gap` に足され、間隔が2か所の指定の和で決まって読み取りにくくなるため。
  aiProne: true
  page: layout/compositions/stack
  since: 0.5.0

- id: stack-nested-gap
  level: 推奨
  rule: '`stack` を入れ子にするときは、内側の `stack` にも `--stack--gap` を渡し、間隔を空けない場合も `0` と明示する。'
  reason: カスタムプロパティは継承されるので、値を渡さない内側の `stack` には、デフォルト値の `0` ではなく外側の値が使われるため。
  page: layout/compositions/stack
  since: 0.5.0

- id: stack-align-self-start
  level: 推奨
  rule: '`stack` の子のうち、ボタンやリンクのように中身の幅で見せたい要素には、置く側の CSS で `align-self: start` を指定する。'
  reason: '`align-items` のデフォルト値 `normal` はフレックスアイテムでは `stretch` と同じに振る舞い、子が `stack` の幅いっぱいに広がるため。'
  note: 子が別のコンポーネントのルートなら、そのコンポーネントの中には書かず、置く側のコンポーネントが子クラスで指定します。
  aiProne: true
  page: layout/compositions/stack
  since: 0.5.0

# 8-14-2 cluster：子を横に並べ、入りきらなければ折り返す
- id: cluster-apart-for-two-ends
  level: 推奨
  rule: '子を両端に分けて置くときは、`cluster` に `--cluster--justification: space-between` を渡さず、`apart` を使う。'
  reason: '子が3つ以上ある `cluster` で `space-between` を使うと、行ごとに子の間隔がばらつき、最後の行の子が左右に離れて置かれるうえ、クラス名から「両端に分ける」意図を読み取れないため。'
  note: '`cluster` の寄せ方は `start`（デフォルトの `normal`）、`center`、`end` から選びます。'
  aiProne: true
  page: layout/compositions/cluster
  since: 0.5.0

- id: cluster-balance-inside-supports
  level: 推奨
  rule: '`flex-wrap: balance` は `@supports (flex-wrap: balance)` の中に書き、その外には `flex-wrap: wrap` を書く。'
  reason: '新しい値に頼った指定であることが条件から読み取れ、未対応の環境では通常の折り返しのまま表示でき、すべての対象ブラウザが対応したときに分岐ごと消せるため。'
  note: '2026年10月時点で `flex-wrap: balance` に対応しているのは Chrome と Edge の150以降だけです。'
  page: layout/compositions/cluster
  since: 0.5.0

- id: cluster-reset-inherited-gap
  level: 推奨
  rule: '入れ子にした `cluster` で行と列の間隔を別々に指定するときは、`--cluster--gap: initial` も渡し、外側から継承した一括の間隔を打ち消す。'
  reason: 'カスタムプロパティは継承し、フォールバックの連鎖では一括の `--cluster--gap` が個別の指定より優先されるので、打ち消さないと内側の `--cluster--row-gap` と `--cluster--column-gap` が使われないため。'
  note: '内側でも一括の `--cluster--gap` を渡すなら、外側の値は上書きされるので不要です。'
  page: layout/compositions/cluster
  since: 0.5.0

# 8-14-3 apart：子要素を両端に分ける
- id: apart-for-two-groups
  level: 推奨
  rule: '`apart` は役割の違う2つのまとまりを両端に分けるときに使い、片側に複数の要素を置くときは1つの要素に包む。'
  reason: '`justify-content: space-between` は子の数と幅によって間隔と折り返した行の位置が変わるので、子が3つ以上あると並び方が予測しにくくなるため。'
  note: タグの一覧やナビゲーションのリンクのように、同じ種類の要素を並べるときは `cluster` を使います。
  aiProne: true
  page: layout/compositions/apart
  since: 0.5.0

- id: apart-column-gap-as-minimum
  level: 推奨
  rule: '`apart` には、両端の要素の最小の間隔を `--apart--column-gap`（または `--apart--gap`）で渡す。'
  reason: '`space-between` が配る余白は幅が狭くなると0まで減るので、列の間隔がないと、両端の要素が接するまで折り返さないため。'
  page: layout/compositions/apart
  since: 0.5.0

- id: apart-auto-margin-for-wrapped-end
  level: 推奨
  rule: '折り返した2行目でも行末側の要素を行末に寄せたいときは、`apart` ではなく、その要素に `margin-inline-start: auto` を指定する。'
  reason: '`space-between` は行に要素が1つしかないとき行頭に置くが、`auto` の `margin` は2行目でも余った空間を吸収して要素を行末に寄せるため。'
  page: layout/compositions/apart
  since: 0.5.0

# 8-14-4 switcher：n列と1列を幅で切り替える
- id: switcher-for-all-or-nothing
  level: 推奨
  rule: 対等な項目を「指定の列数か1列か」のどちらかで並べたいときは `switcher` を使い、列数が段階的に減ってよい一覧には `grid` を使う。
  reason: '`auto-fit` だけで並べると、途中の幅で最後の項目が1つだけ次の行に落ち、項目が対等に見えなくなるため。'
  note: 幅の違う2つの要素（メインとサイド）を並べるときは `sidebar` を使います。
  page: layout/compositions/switcher
  since: 0.5.0

- id: switcher-preferred-width-formula
  level: 必須
  rule: '`switcher` の列の幅の目安は「（100% − 列の間隔 ×（列数 − 1））÷ 列数」で計算する。'
  reason: 「100% ÷ 列数 − 列の間隔 ×（列数 − 1）」と書くと目安が小さくなりすぎ、`auto-fit` が指定より多くの列を作るため。
  note: 例：列数4、列の最小幅200px、列の間隔24pxで要素の幅が1000pxのとき、正しい式では4列、誤った式では5列になります。
  aiProne: true
  page: layout/compositions/switcher
  since: 0.5.0

- id: switcher-gap-default-with-unit
  level: 必須
  rule: 閾値などの `calc()` で長さと足し合わせる間隔のデフォルト値は、単位のない `0` ではなく `0px` と書く。
  reason: 単位のない `0` は数値として扱われ、「長さ＋数値」の式が無効になって、宣言全体が初期値に戻るため。
  note: '`switcher` では、`grid-template-columns` が `none` に戻り、どの幅でも1列になります。'
  aiProne: true
  page: layout/compositions/switcher
  since: 0.5.0

# 8-14-5 sidebar：メインとサイドの2カラムにし、狭ければ縦に積む
- id: sidebar-before-queries
  level: 推奨
  rule: 幅の決まったサイドと伸び縮みするメインの2つを横に並べ、狭ければ縦に積む配置は、クエリで閾値を書かず、`sidebar` コンポジションで組む。
  reason: 折り返す幅が「メインの最小幅＋サイドの幅＋列の間隔」として子の幅の指定から決まり、サイドの幅や間隔を変えても閾値を計算し直さずに済むため。
  note: 要素が3つ以上ある配置、折り返す幅をデザインの都合で決めたい配置、並べたときと積んだときで見た目の順番を変えたい配置は、`grid-template` のエリアとコンテナクエリで組む。
  page: layout/compositions/sidebar
  since: 0.5.0
- id: sidebar-two-direct-children
  level: 必須
  rule: '`sidebar` の直接の子は2つだけにし、それぞれに `.main-column` と `.side-column` を付ける。'
  reason: '`flex-grow` と `flex-basis` は2つのクラスにだけ指定されており、クラスのない子や3つ目の子が加わると、折り返す幅の計算が成り立たなくなるため。'
  note: '`:first-child` のような位置で選ばず、クラスで役割を指定するので、サイドを先に書いてもメインとサイドは入れ替わらない。'
  aiProne: true
  page: layout/compositions/sidebar
  since: 0.5.0
- id: sidebar-side-position-by-source-order
  level: 推奨
  rule: '`sidebar` のサイドを左右どちらに置くかは HTML の順番で決め、`flex-direction: row-reverse` や `order` で見た目だけを入れ替えない。'
  reason: 横に並んでいる間、キーボードで移動する順番と読み上げの順番が、見た目の順番と食い違うため。
  note: 本文の後に見る補助の内容（関連記事など）は本文の後に、先に知っておくと便利な内容（章の目次、絞り込みの条件など）は本文の前に書く。
  aiProne: true
  page: layout/compositions/sidebar
  since: 0.5.0
- id: sidebar-widths-above-min-content
  level: 推奨
  rule: '`--sidebar--main-min-width` と `--sidebar--side-width` には、それぞれの子の中身の最小幅（長い単語、固定幅の画像、表など）より大きな値を渡す。'
  reason: フレックスアイテムは中身の最小幅より狭くならず、折り返しの判定にも大きいほうが使われるので、指定より広い幅で折り返すようになるため。
  page: layout/compositions/sidebar
  since: 0.5.0

# 8-14-6 grid：列の最小幅と最大数から列数を決める
- id: grid-max-count-over-queries
  level: 推奨
  rule: 同じ形のアイテムを並べる一覧で列の数に上限があるときは、メディアクエリで列数を切り替えず、`grid` の `--grid--column-min-width` と `--grid--column-max-count` で列の最小幅と最大数を渡す。
  reason: 列数が画面ではなく一覧自身の幅から決まり、どこに置いても最小幅を下回らず、最大数を超えないため。
  aiProne: true
  page: layout/compositions/grid
  since: 0.5.0

- id: grid-mode-auto-fill-default
  level: 推奨
  rule: '件数が変わる一覧では `--grid--mode` をデフォルトの `auto-fill` のままにし、`auto-fit` は件数が最大数に届かないときに行いっぱいに広げたい並びにだけ渡す。'
  reason: '`auto-fit` では件数が少ないときにアイテムが行いっぱいに広がり、件数によってカードの幅や見た目が変わるため。'
  page: layout/compositions/grid
  since: 0.5.0

- id: grid-gap-with-unit
  level: 必須
  rule: '`grid` の列の間隔には、`0` を渡すときも `0px` のように単位の付いた長さを渡す。'
  reason: 列の幅の計算で間隔を `100%` から引くので、単位のない `0` を渡すと `grid-template-columns` の宣言が無効になり、1列に並ぶため。
  aiProne: true
  page: layout/compositions/grid
  since: 0.5.0

- id: grid-switcher-for-fixed-sets
  level: 推奨
  rule: 数が決まっていて揃いで見せたいアイテム（特徴や料金プランなど）は、`grid` ではなく `switcher` で並べる。
  reason: '`grid` は列が1つずつ減るので、幅によっては1つのアイテムだけが次の行に残り、揃いの印象が崩れるため。'
  page: layout/compositions/grid
  since: 0.5.0

# 8-14-7 columns：上から下へ読むリストを段に分ける
- id: columns-single-list-child
  level: 推奨
  rule: '`columns` コンポジションの直下には段に分けるリストを1つだけ置き、見出しなどはその外に置く。'
  reason: 段組みと負のマージンは直下の子すべてに付くので、リスト以外の要素を入れると、その要素まで段組みになり、余白も崩れるため。
  note: '項目の `li` や `div` は、段組みを付けたリストの直下に置きます。`dl` では用語と説明を `div` で包むと、まとめて段の境目で分かれなくなります。'
  aiProne: true
  page: layout/compositions/columns
  since: 0.5.0

- id: columns-not-for-tall-lists
  level: 非推奨
  rule: 画面の高さを超える長さのリストを、1つの段組みにしない。
  reason: 1段目を読み終えるたびに、2段目の先頭まで上へスクロールして戻る必要があるため。
  note: 長いサイトマップは、見出しとリストのまとまりに分けて `grid` や `masonry` で並べ、各まとまりの中だけを `columns` にします。
  page: layout/compositions/columns
  since: 0.5.0

- id: columns-negative-margin-in-flow-root
  level: 推奨
  rule: 'コンポジションの中の要素に負のマージンを付けて端の余白を打ち消すときは、ルートを `display: block flow-root` にする。'
  reason: 通常のフローでは、先頭の子の負のマージンが親を突き抜けて外の要素のマージンと相殺し、コンポジションの外側の余白が変わるため。
  note: 負のマージンはルートには付けず、内側の要素に付けます。ルートに付けると、親の `gap` や隣の要素との間隔が変わります。
  page: layout/compositions/columns
  since: 0.5.0

# 8-14-8 masonry：高さの違う子を短い列へ詰めて並べる
- id: masonry-for-loose-order-lists
  level: 推奨
  rule: '`masonry` コンポジションは、新着順の一覧のように高さがそろわず、おおよその順番が伝われば足りる項目に使い、高さのそろう項目や順番が内容になる項目は `grid` コンポジションで並べる。'
  reason: '高さがそろう項目では詰める隙間がなく、`grid-lanes` の配置では見た目の順番と HTML の順番（読み上げとフォーカスの順番）がずれる可能性だけが残るため。'
  note: '上から下へ読む1つのリストを段に分けるときは、`columns` コンポジションを使います。'
  page: layout/compositions/masonry
  since: 0.5.0

- id: masonry-tolerance-default-normal
  level: 推奨
  rule: '`masonry` コンポジションの `--masonry--tolerance` のデフォルト値は `flow-tolerance` の初期値と同じ `normal` にし、項目が左右へ飛んで見えるときだけ `3em` のような大きめの長さを渡す。'
  reason: '`0` にすると、ほぼ同じ高さの列のどちらに置くかを厳密に決めることになり、項目が左右へ大きく飛ぶ配置が起きやすいため。'
  note: '`infinite` は渡しません。'
  aiProne: true
  page: layout/compositions/masonry
  since: 0.5.0

# 8-14-9 pile：子要素を同じセルに重ねる
- id: pile-placement-on-target-child
  level: 推奨
  rule: '`pile` の子の位置を変えるときは、`--pile--placement` などの公開プロパティを、`.pile` ではなく動かしたい子の `style` 属性で渡す。'
  reason: '`.pile` で渡すと、継承ですべての子に同じ配置がかかり、大きさを指定していない背景用の要素が中身の大きさに縮むため。'
  note: '`--pile--placement` に渡すキーワードは1つだけです。方向ごとに違う値を使うときは、`--pile--alignment` と `--pile--justification` を個別に指定します。'
  aiProne: true
  page: layout/compositions/pile
  since: 0.5.0

- id: pile-no-grid-placement-on-children
  level: 禁止
  rule: '`pile` の子に、コンポーネントの CSS で `grid-area`、`grid-row`、`grid-column` を指定しない。'
  reason: '`components` レイヤーが `compositions` レイヤーより優先されるので、子が `--pile` のエリアから外れて重ならなくなるため。'
  note: '`.pile > *` で選ばれない `::before` と `::after` は例外で、重ねるならコンポーネントの側で `grid-area: --pile` を指定します。'
  page: layout/compositions/pile
  since: 0.5.0

- id: pile-scrim-for-text-on-image
  level: 推奨
  rule: '`pile` で画像の上に文字を重ねるときは、文字と画像の間に暗い層を置き、どの画像でも文字のコントラスト比が保たれるようにする。'
  reason: 画像の差し替えや文字の折り返しで、文字の下に来る部分の明るさが変わるため。
  note: '白い文字なら、黒い層の不透明度を55％以上にすると、真っ白な画像の上でもコントラスト比が4.5:1を超えます。画像を読み込めなかったときのために、ルートに暗い `background-color` も指定します。'
  aiProne: true
  page: layout/compositions/pile
  since: 0.5.0

- id: pile-not-for-overflowing-layers
  level: 推奨
  rule: 枠の外へはみ出させる要素（角からはみ出すバッジ、ドロップダウンなど）は、`pile` で重ねず、絶対配置やトップレイヤーで表示する。
  reason: '`pile` の子は親の大きさに反映されて枠の中に収まり、`isolation: isolate` で重なり順も `pile` の中に閉じるため。'
  page: layout/compositions/pile
  since: 0.5.0

# 8-14-10 primary-layout：コンテンツ幅とガターを決め、子に5段階の幅を選ばせる
- id: primary-layout-width-by-line-names
  level: 推奨
  rule: '`primary-layout` の子の幅は、子に最大幅や負の `margin` を書かず、`full-column` などのクラスか `grid-column: --wide` のような線の名前で選ぶ。'
  reason: 幅の段階とガターの値が `primary-layout` の1か所にまとまり、画面の幅で値を変えるときも子を直さずに済むため。
  note: 画面の端まで広げる方法の比較は、第8章のルール `full-bleed-via-layout-first` を参照してください。
  aiProne: true
  page: layout/compositions/primary-layout
  since: 0.5.0

- id: primary-layout-center-column-subtract-both-sides
  level: 必須
  rule: 中央の列の最大幅は、コンテンツ幅の最大値から、その両側に足す列の上限を2本分引いて求める（`var(--_c--content-max-width) - var(--_c--narrow-reduction) * 2`）。
  reason: 片側の分しか引かないと、コンテンツ幅が指定した最大値より列1本分だけ広くなるため。
  aiProne: true
  page: layout/compositions/primary-layout
  since: 0.5.0

- id: primary-layout-child-classes-unprefixed
  level: 推奨
  rule: コンポジションの子に付けて置き場所を選ぶクラスは、`full-column` のように接頭辞を付けずに名付け、`& > .full-column` のように直下の子に限って効かせる。
  reason: '`_` はコンポーネントの子要素、`-` はどこでも効くユーティリティの印なので、どちらでもないコンポジションの一部であることを名前とセレクタで示すため。'
  page: layout/compositions/primary-layout
  since: 0.5.0

# 8-14-11 prose：子ごとに変えられる間隔で、本文の流れを作る
- id: prose-space-on-following-child
  level: 推奨
  rule: '`prose` の中で特定の間だけ間隔を変えるときは、`margin` を足さず、その間の後ろにある子に `--prose--space` を渡す。'
  reason: '`margin-block-start` の `var(--prose--space)` は子要素の上で解決されるので、渡した子の前の間隔だけが変わり、打ち消しや差分の計算が要らないため。'
  note: '見出しの前を広げるなら見出しに、見出しの直後を詰めるなら見出しの次の要素に渡します。値は `style` 属性で渡し、画面の幅で変えるときや複数の子にまとめて渡すときはコンポーネントの CSS で渡します。'
  aiProne: true
  page: layout/compositions/prose
  since: 0.5.0

- id: prose-no-internal-property
  level: 必須
  rule: '`prose` の `--prose--space` はルートで内部プロパティに受け直さず、子要素の `margin-block-start` の `var()` で直接参照する。'
  reason: 'ルートで受け直すと `var()` がルートの上で解決され、子には解決済みの値が継承されるので、子に渡した `--prose--space` が効かなくなるため。'
  note: 公開プロパティを `:scope` で内部プロパティに受ける規約（第7章のルール `receive-public-property-with-fallback`）の例外です。
  aiProne: true
  page: layout/compositions/prose
  since: 0.5.0

- id: prose-nested-inner-space
  level: 推奨
  rule: '`prose` の中に `prose` を入れるときは、内側のルートの `--prose--space` を外側との間隔に使い、内側の間隔は内側の子に渡す。'
  reason: 'ルートに渡した値は継承によって内側の子にも届き、外側との間隔と内側の間隔が同じ値になってしまうため。'
  note: '例：`._note { & > * { --prose--space: calc(var(--spacing--xxs) / 16 * 1rem); } }`'
  page: layout/compositions/prose
  since: 0.5.0

- id: prose-not-on-cms-body
  level: 非推奨
  rule: CMS で編集者が入力する本文エリア（`.wysiwyg` など）には `prose` を付けず、`prose` は本文エリアとその前後の要素を並べる外側に使う。
  reason: 編集者は子に `style` 属性を付けられないうえ、本文エリアの余白のルールと同じ `margin-block-start` を指定し合い、`compositions` レイヤーの `prose` が黙って負けるため。
  page: layout/compositions/prose
  since: 0.5.0

# 8-15 表示順と読み上げ順を合わせる
- id: reading-flow-when-reordered
  level: 必須
  rule: '`grid-template-areas`、`flex-direction: row-reverse | column-reverse`、`flex-wrap: wrap-reverse`、`grid-auto-flow: dense` を書いたルールには、同じルールに `reading-flow` を指定する。'
  reason: 見た目の順番が DOM の順番から離れても、対応したブラウザでは読み上げとフォーカスが見た目の順番に追従し、見た目と DOM の順番が一致しているときも読む順番を確かめた印としてコードに残るため。
  note: 'エリアの文字列を含む `grid-template` と `grid`、逆順を含む `flex-flow` も対象です。Grid には `grid-rows` か `grid-columns`、Flexbox には `flex-visual` か `flex-flow` を選びます。空のセル（`.`）を含まず、エリアの名前が1種類しかないテンプレート（`"--pile"` のように、すべての子を同じセルに重ねるもの）は、並べ替えにならないので対象外です。子の `order` や明示的な `grid-row`・`grid-column` で並べ替えるときも親のコンテナに指定しますが、これは Stylelint では検出できません。'
  lint: 'Stylelint: `book/reading-flow-when-reordered`（本書の独自ルール）'
  aiProne: true
  page: layout/reading-flow
  since: 0.9.0

- id: no-reading-order
  level: 非推奨
  rule: '子に `reading-order` を指定して、読む順番を要素ごとに上書きしない。'
  reason: 見た目の順番、DOM の順番、読む順番がそれぞれ別の指定で決まり、読む順番を知るために各子の値を集めて並べ直す必要が生じるため。
  note: '読む順番を変えたいときは、HTML の順番を直すか、コンテナの `reading-flow` に `grid-rows` や `flex-visual` を指定します。'
  aiProne: true
  page: layout/reading-flow
  since: 0.9.0
