# 第7章 レイアウト

# 7-1 Gridから考える
- id: grid-template-first
  level: 推奨
  rule: レイアウトを組むときは、まず親の `grid-template` で子要素の配置と大きさを決められないかを検討する。
  reason: 配置が親の指定だけで完結し、子要素の側に幅の計算や個別の指定を書かずに済むため。
  note: 「1次元なら Flexbox、2次元なら Grid」という分け方は正確ではありません。1列や1行の並びでも、Grid のほうが簡潔に書ける場面は多くあります。
  aiProne: true
  page: layout/grid-first
  since: 0.1.0

- id: flexbox-for-content-sized-items
  level: 推奨
  rule: タグやメニューのように、中身の量で幅が決まる要素を並べて折り返すときは、Flexbox を使う。
  reason: 子要素の幅を決めずに並べられ、入りきらない要素は自動で次の行へ回るため。
  page: layout/grid-first
  since: 0.1.0

- id: grid-areas-for-changing-structure
  level: 推奨
  rule: 幅や中身によって配置の構造が変わるレイアウトは、`grid-template` のエリアで書き、条件ごとにテンプレートだけを書き換える。
  reason: 配置の変化が1か所にまとまり、子要素ごとに条件を書かずに済むため。
  note: エリアの名前を `--` で始める規則は、第5章のルール `dashed-ident-names` で扱います。
  page: layout/grid-first
  since: 0.1.0

- id: grid-area-names-match-children
  level: 推奨
  rule: グリッドのエリアの名前は、そのエリアに置く子要素のクラス名とそろえる（`._image` を置くエリアは `--image`）。
  reason: '`grid-template` の図と、各要素の `grid-area` の対応をすぐに読み取れるため。'
  page: layout/grid-first
  since: 0.1.0

- id: source-order-for-reading
  level: 推奨
  rule: HTML は見た目の順番ではなく文書構造の順番（見出しから）で書き、見た目の順番が違うときは Grid の配置で入れ替える。
  reason: スクリーンリーダーの読み上げや、CSS が効かない環境でも、内容が意味の通る順番で伝わるため。
  note: フォーカスできる要素の順番を入れ替えると、キーボードで移動する順番が見た目と食い違います。見た目と操作の順番をそろえる `reading-flow` は、2026年9月時点で Chrome 系のブラウザだけが対応しています。
  page: layout/grid-first
  since: 0.1.0

- id: subgrid-for-aligned-rows
  level: 推奨
  rule: 並べたカードの中の見出し、本文、ボタンの位置をそろえるときは、固定の高さや JavaScript ではなく、サブグリッドを使う。
  reason: 中身の量が変わっても、同じ行にある要素の高さが自動でそろうため。
  note: '`flex-direction: column` と `flex-grow` の組み合わせでは、そろえられるのは1か所だけです。'
  aiProne: true
  page: layout/grid-first
  since: 0.1.0

- id: subgrid-span-rows
  level: 必須
  rule: '`grid-template-rows: subgrid` を指定した要素には、中の要素の数と同じ行数を `grid-row: span N` で指定する。'
  reason: 指定しないと、サブグリッドが親の1行分にしかまたがらず、中の要素がすべて同じ1行に押し込まれるため。
  page: layout/grid-first
  since: 0.1.0

- id: display-contents-keep-role
  level: 推奨
  rule: 'サブグリッドのために `display: contents` で箱をなくす要素は、ロールを持たない `div` に限るか、`role` 属性でロールを明示して読み上げを確かめる。'
  reason: '`display: contents` を指定した要素は、ブラウザによっては見出しやリストなどの暗黙のロールが失われることがあるため。'
  page: layout/grid-first
  since: 0.1.0

- id: float-for-text-wrap
  level: 推奨
  rule: '画像のまわりに文字を回り込ませるときは `float` を使い、囲む要素には clearfix ではなく `display: flow-root` を指定する。'
  reason: 回り込みは `float` の本来の用途で、`flow-root` なら余計な擬似要素なしに `float` を内側に収められるため。
  note: '値は `float: inline-end` のように論理値で書きます。'
  page: layout/grid-first
  since: 0.1.0

# 7-2 余白を設計する
- id: gap-over-child-margin
  level: 推奨
  rule: Flexbox や Grid の子要素の間隔は、子要素の `margin` ではなく、親の `gap` で作る。
  reason: 端の要素の余白を打ち消す指定が要らず、折り返したときに行の頭へ余計な余白が残ることもないため。
  aiProne: true
  page: layout/spacing
  since: 0.1.0

- id: empty-grid-cells-for-spacing
  level: 推奨
  rule: 要素の間ごとに大きさの違う余白は、`grid-template` に空のセル（`.`）の行や列を置いて作る。
  reason: 余白の指定が `grid-template` の1か所にまとまり、見れば構造が分かるうえ、余白のための要素を足さずに済むため。
  note: 余白の差を作るためだけに、`padding` を持つ `div` を足しません。
  page: layout/spacing
  since: 0.1.0

- id: owl-margin-for-optional-elements
  level: 推奨
  rule: 状況によって要素の有無や数が変わる場所では、`* + *` で2つ目以降の要素にだけ `margin-block-start` を付けて間隔を作る。
  reason: 空のセルで余白を決めておくと、要素が欠けたときに余白だけが残るため。
  page: layout/spacing
  since: 0.1.0

- id: prose-in-normal-flow
  level: 推奨
  rule: 本文のように種類の違う要素が続く領域は、Flexbox や Grid の `gap` にせず、通常フローのまま `margin` で間隔を作る。
  reason: '`float` による回り込みや `margin` の相殺が働き、要素ごとの余白の大小を自然に調整できるため。'
  note: CMS の本文エリアでの書き方は、第12章「実務での運用」で扱います。
  page: layout/spacing
  since: 0.1.0

- id: gutter-columns-for-content-width
  level: 推奨
  rule: ページのコンテンツの最大幅と画面の端の余白は、グリッドの左右に余白の列（ガター）を作って決める。
  reason: 画面幅いっぱいに広げたい要素を、ガターの列まで広げるだけで作れるため。
  note: 第6章のコンポジション `primary-layout` は、この形を部品にしたものです。
  page: layout/spacing
  since: 0.1.0

# 7-3 変化に強いレイアウト
- id: design-for-content-changes
  level: 推奨
  rule: CSS を書くときは、テキストが2倍の長さになったら、画像がなかったら、要素の数が変わったらと考え、そのパターンで表示を確かめる。
  reason: CMS での更新や改修によって、デザインカンプにない内容が入ることは避けられないため。
  page: layout/defensive
  since: 0.1.0

- id: minmax-min-capped-at-100-percent
  level: 必須
  rule: '`minmax()` の最小値や `min-inline-size` に固定の長さを書くときは、`min(100%, …)` で親の幅を上限にする。'
  reason: 親がその長さより狭くなったときに、はみ出すのを防ぐため。
  note: '例：`repeat(auto-fit, minmax(min(100%, calc(360 / 16 * 1rem)), 1fr))`、`min-inline-size: min(100%, 320px)`。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: minmax-zero-for-fr
  level: 推奨
  rule: 列を均等や比率で分けるときは、`1fr` ではなく `minmax(0, 1fr)` と書く。
  reason: '`1fr` の最小値は中身の最小幅になり、長い URL や入力欄が列を押し広げるため。'
  note: '全称セレクタの `min-inline-size: 0`（第4章のルール `global-min-inline-size-zero`）でも防げますが、トラックの側で最小値を決めておけば、グローバルの指定に頼らずに済みます。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: flex-wrap-for-variable-items
  level: 推奨
  rule: '要素の数が変わる可能性のある Flexbox には、`flex-wrap: wrap` を指定する。'
  reason: 要素が増えたときや画面が狭いときに、折り返せずにはみ出すのを防ぐため。
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: fit-content-over-flex-shrink-zero
  level: 推奨
  rule: '文字を含む flex アイテムが縮みすぎないようにするときは、`flex-shrink: 0` ではなく `min-inline-size: fit-content` を使う。'
  reason: '`flex-shrink: 0` の要素は親より長くても縮まずにはみ出すが、`fit-content` なら親の幅を超えるときだけ折り返すため。'
  note: 'アイコンのように、大きさを変えたくない要素には `flex-shrink: 0` を指定します。'
  page: layout/defensive
  since: 0.1.0

- id: no-nowrap-without-reason
  level: 非推奨
  rule: '明確な理由がない限り、`white-space: nowrap` を指定しない。'
  reason: 内容が長くなったときや画面が狭いときに、折り返せずにはみ出すため。
  aiProne: true
  page: layout/defensive
  since: 0.1.0

- id: find-overflow-source-first
  level: 推奨
  rule: 横スクロールが起きたら、はみ出しを隠す前に、はみ出している要素を特定して原因を直す。
  reason: 隠すだけでは、はみ出した内容が切れて読めなくなることがあり、同じ原因の不具合がほかの場所でも残るため。
  page: layout/defensive
  since: 0.1.0

- id: overflow-clip-over-hidden
  level: 必須
  rule: 'はみ出しを切り取るだけなら、`overflow: hidden`（`overflow-x: hidden`）ではなく `clip` を使う。'
  reason: '`hidden` は要素をスクロールコンテナにするので、中の `position: sticky` が効かなくなるため。'
  note: '`contain: paint` も、中の `position: fixed` の基準を変えてしまうので、はみ出しの対策には使いません。'
  aiProne: true
  page: layout/defensive
  since: 0.1.0

# 7-4 重なりと配置
- id: grid-stack-before-absolute
  level: 推奨
  rule: '要素を重ねるときは、`position: absolute` の前に、Grid の同じエリアに置く方法を検討する。'
  reason: 重ねたどの要素の大きさも親の高さに反映されるので、文字が増えても画像からはみ出さないため。
  note: 第6章のコンポジション `pile` は、この形を部品にしたものです。
  aiProne: true
  page: layout/positioning
  since: 0.1.0

- id: containing-block-inside-component
  level: 推奨
  rule: '`position: absolute` の要素の基準にする祖先には、同じコンポーネントの中で `position: relative` を指定する。'
  reason: 基準がコンポーネントの外の祖先に決まると、置く場所によって位置が変わるため。
  page: layout/positioning
  since: 0.1.0

- id: absolute-centering-with-margin-auto
  level: 推奨
  rule: '絶対配置の要素を中央に置くときは、`translate: -50% -50%` ではなく、`inset: 0` と `margin: auto` を使う。'
  reason: 位置を決める指定が `inset` と `margin` にまとまり、変形のプロパティを配置のために使わずに済むため。
  note: '`inset: 0` だけでは親いっぱいに広がるので、`inline-size` と `block-size`（`fit-content` など）で大きさを決めます。グリッドやフレックスの中なら、`place-items: center` で足ります。'
  aiProne: true
  page: layout/positioning
  since: 0.1.0

- id: no-fixed-inside-transformed-ancestor
  level: 非推奨
  rule: '`position: fixed` の要素を、`transform`、`filter`、`contain` などを指定した祖先の中に置かない。'
  reason: これらの祖先が包含ブロックになり、要素がビューポートではなくその祖先を基準に配置されるため。
  note: モーダルは、`<dialog>` の `showModal()` でトップレイヤーに表示します（第11章）。
  page: layout/positioning
  since: 0.1.0

- id: check-stacking-context-first
  level: 推奨
  rule: 重なり順がおかしいときは、z-index の値を大きくする前に、どのスタッキングコンテキストの中で比べられているかを確かめる。
  reason: z-index は同じスタッキングコンテキストの中でしか比べられず、祖先のコンテキストの順位を超えられないため。
  note: z-index の値の決め方と `isolation` は、第6章のルール `z-index-tokens-only`、`isolation-for-relative-z-index` で扱います。
  aiProne: true
  page: layout/positioning
  since: 0.1.0

- id: anchor-scope-for-repeated-components
  level: 推奨
  rule: 繰り返し置くコンポーネントの中でアンカーポジショニングを使うときは、ルートに `anchor-scope` を指定して、アンカーの名前が届く範囲をコンポーネントの中に限る。
  reason: 同じ名前のアンカーが複数あると、別のコンポーネントのアンカーが基準に選ばれることがあるため。
  note: アンカーポジショニングをレイアウトの要として使わない規則は、第1章のルール `no-unsupported-layout-features` で扱います。
  page: layout/positioning
  since: 0.1.0

- id: full-bleed-via-layout-first
  level: 推奨
  rule: 要素を画面幅いっぱいに広げるときは、まずレイアウトのガターの列まで広げる方法を使い、ビューポート単位で広げるのは、背景の装飾と横にスクロールする領域に限る。
  reason: ビューポート単位はスクロールバーの幅の扱いがブラウザによって異なり、横スクロールの原因になりやすいため。
  page: layout/positioning
  since: 0.1.0

- id: full-bleed-offset-formula
  level: 必須
  rule: 親の幅を超えて画面の端まで広げる量は、`calc((100lvi - 100%) / -2)` のように「画面の幅と親の幅の差の半分」の式で書き、`100vw` や `calc(50% - 50vw)` を使わない。
  reason: 何をどれだけ広げているのかが式から読め、`vw` の曖昧さも避けられるため。
  note: '横にスクロールする領域では、`100%` の代わりに名前付きのコンテナの `100cqi` を使います。`vw` を使わない理由は、第3章のルール `no-vw-vh` を参照してください。'
  aiProne: true
  page: layout/positioning
  since: 0.1.0
