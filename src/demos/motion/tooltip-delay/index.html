<div class="scoped format-toolbar" role="group" aria-label="文字の書式">
  <span class="_item">
    <button type="button" aria-labelledby="format-toolbar-bold"><b>B</b></button>
    <span class="_tooltip" id="format-toolbar-bold">太字</span>
  </span>
  <span class="_item">
    <button type="button" aria-labelledby="format-toolbar-italic"><i>I</i></button>
    <span class="_tooltip" id="format-toolbar-italic">斜体</span>
  </span>
  <span class="_item">
    <button type="button" aria-labelledby="format-toolbar-underline"><u>U</u></button>
    <span class="_tooltip" id="format-toolbar-underline">下線</span>
  </span>
  <span class="_item">
    <button type="button" aria-labelledby="format-toolbar-strike"><s>S</s></button>
    <span class="_tooltip" id="format-toolbar-strike">取り消し線</span>
  </span>
</div>
