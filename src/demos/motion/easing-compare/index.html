<div class="scoped easing-demo">
  <label class="_toggle"><input type="checkbox">4つの点を同時に動かす（どれも240ms）</label>
  <dl class="_rows">
    <div class="_row | -ease">
      <dt><code>ease</code>（デフォルト）</dt>
      <dd class="_track"><span class="_dot"></span></dd>
    </div>
    <div class="_row | -ease-in">
      <dt><code>ease-in</code></dt>
      <dd class="_track"><span class="_dot"></span></dd>
    </div>
    <div class="_row | -out-quint">
      <dt><code>--ease--out-quint</code></dt>
      <dd class="_track"><span class="_dot"></span></dd>
    </div>
    <div class="_row | -out-expo">
      <dt><code>--ease--out-expo</code></dt>
      <dd class="_track"><span class="_dot"></span></dd>
    </div>
  </dl>
</div>
