<section class="scoped faq-list" aria-labelledby="faq-list-heading">
  <h2 id="faq-list-heading">よくある質問</h2>
  <details name="faq-list" open>
    <summary>送料はかかりますか？</summary>
    <p>5,000円以上のご注文で送料が無料になります。それ未満のご注文では、全国一律550円の送料がかかります。</p>
  </details>
  <details name="faq-list">
    <summary>注文をキャンセルできますか？</summary>
    <p>発送の準備が始まる前であれば、マイページの注文履歴からキャンセルできます。準備が始まった後は、お問い合わせフォームからご連絡ください。</p>
  </details>
  <details name="faq-list">
    <summary>領収書は発行できますか？</summary>
    <p>発送の完了後に、マイページから領収書をダウンロードできます。宛名は、ダウンロードの画面で変更できます。</p>
  </details>
</section>
