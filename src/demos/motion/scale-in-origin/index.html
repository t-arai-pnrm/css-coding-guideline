<div class="scoped scale-in-demo">

  <button type="button" popovertarget="scale-in-demo-menu">ドロップダウン</button>
  <ul class="_menu" id="scale-in-demo-menu" popover>
    <li><button type="button">複製する</button></li>
    <li><button type="button">名前を変更する</button></li>
    <li><button type="button">アーカイブする</button></li>
  </ul>

  <button type="button" popovertarget="scale-in-demo-dialog">ダイアログ</button>

    <p>この下書きを公開します。公開したあとも、内容は編集できます。</p>
    <button type="button" popovertarget="scale-in-demo-dialog" popovertargetaction="hide">閉じる</button>
