<section class="scoped faq-list" aria-labelledby="faq-list-heading">
  <h2 class="_heading" id="faq-list-heading">よくある質問</h2>
  <details class="_item" name="faq-list" open>
    <summary class="_summary">送料はかかりますか？</summary>
    <p class="_answer">5,000円以上のご注文で送料が無料になります。それ未満のご注文では、全国一律550円の送料がかかります。</p>
  </details>
  <details class="_item" name="faq-list">
    <summary class="_summary">注文をキャンセルできますか？</summary>
    <p class="_answer">発送の準備が始まる前であれば、マイページの注文履歴からキャンセルできます。準備が始まった後は、お問い合わせフォームからご連絡ください。</p>
  </details>
  <details class="_item" name="faq-list">
    <summary class="_summary">領収書は発行できますか？</summary>
    <p class="_answer">発送の完了後に、マイページから領収書をダウンロードできます。宛名は、ダウンロードの画面で変更できます。</p>
  </details>
