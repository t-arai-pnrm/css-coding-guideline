<div class="scoped grayscale-demo">
  <label class="_switch">
    <input type="checkbox">
    グレースケールで表示する
  </label>
  <div class="_preview">
    <section class="_column">
      <h2 class="_heading">色だけで区別する</h2>
      <p class="_text">詳しくは<a class="_link" href="#">料金プランの比較</a>をご覧ください。</p>
      <label class="_field">
        メールアドレス
        <input class="_input" type="email" value="example.com" aria-invalid="true">
      </label>
    </section>
    <section class="_column" data-cue="shape">
      <h2 class="_heading">色以外の手がかりも使う</h2>
      <p class="_text">詳しくは<a class="_link" href="#">料金プランの比較</a>をご覧ください。</p>
      <label class="_field">
        メールアドレス
        <input class="_input" type="email" value="example.com" aria-invalid="true" aria-describedby="grayscale-demo-error">
        <span class="_error" id="grayscale-demo-error">エラー：「@」を含むアドレスを入力してください</span>
      </label>
    </section>
  </div>
</div>
