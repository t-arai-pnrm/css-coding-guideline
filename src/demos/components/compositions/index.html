<div class="scoped composition-demo stack" style="--stack--gap: calc(var(--spacing--lg) / 16 * 1rem)">
  <ul class="_tags cluster" style="--cluster--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
    <li class="_tag">CSS</li>
    <li class="_tag">コンポジション</li>
    <li class="_tag">カスタムプロパティ</li>
    <li class="_tag">レイアウト</li>
    <li class="_tag">デザイントークン</li>
    <li class="_tag">ユーティリティ</li>
  </ul>
  <div
    class="switcher"
    style="--switcher--column-count: 3; --switcher--column-min-width: calc(160 / 16 * 1rem); --switcher--gap: calc(var(--spacing--sm) / 16 * 1rem)"
  >
    <section class="_panel stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">stack</h2>
      <p class="_text">子要素を縦に積み、間隔をそろえます。</p>
    </section>
    <section class="_panel stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">cluster</h2>
      <p class="_text">子要素を横に並べ、入りきらなければ折り返します。</p>
    </section>
    <section class="_panel stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">switcher</h2>
      <p class="_text">幅が閾値を下回ると、3列から1列に切り替わります。</p>
    </section>
  </div>
</div>
