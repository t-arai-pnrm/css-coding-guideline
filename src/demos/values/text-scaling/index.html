<div class="scoped text-scaling">
  <fieldset>
    <legend>ブラウザの文字サイズの設定（ルートの文字サイズで再現）</legend>
    <label><input type="radio" name="text-scale" value="100" checked> 標準（16px）</label>
    <label><input type="radio" name="text-scale" value="125"> 大（20px）</label>
    <label><input type="radio" name="text-scale" value="150"> 特大（24px）</label>
  </fieldset>
  <div>
    <article data-unit="px">
      <h2>すべてpxのカード</h2>
      <p>文字サイズの設定を変えても、文字も余白も大きくなりません。</p>
    </article>
    <article data-unit="rem">
      <h2>すべてremのカード</h2>
      <p>文字と一緒に余白や線まで大きくなり、1行に入る文字数が減ります。</p>
    </article>
    <article data-unit="mixed">
      <h2>使い分けたカード</h2>
      <p>文字は大きくなり、余白と線はそのままなので、文字を置く場所が広く残ります。</p>
    </article>
  </div>
</div>
