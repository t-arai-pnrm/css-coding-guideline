<div class="scoped placeholder-shown-scope">
  <fieldset data-negated>
    <legend><code>&amp;:not(:placeholder-shown)</code> を入力済みとする</legend>
    <label>表示名 <input type="text" placeholder="例：たろう"></label>
    <label>備考（placeholder 属性なし） <input type="text"></label>
  </fieldset>
  <fieldset data-fixed>
    <legend><code>&amp;:placeholder-shown</code> を未入力とする</legend>
    <label>表示名 <input type="text" placeholder="例：たろう"></label>
    <label>備考（placeholder 属性なし） <input type="text"></label>
  </fieldset>
</div>
