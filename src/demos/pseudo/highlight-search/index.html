<div class="scoped text-search">
  <search>
    <label for="text-search-query">本文から探す</label>
    <input id="text-search-query" type="search" value="範囲">
  </search>
  <p class="_status" role="status"></p>
  <div class="_body">
    <p><code>::highlight()</code> は、JavaScriptで登録した文字の範囲を選ぶ擬似要素です。範囲を要素で包まないので、DOMは変わりません。</p>
    <p>ページ内検索の一致箇所のように、操作に合わせて範囲を描き直す表示に使います。色を付けた<strong>文字の範囲</strong>は、選択したりコピーしたりしても、ふつうの文字のまま扱われます。</p>
  </div>
</div>
