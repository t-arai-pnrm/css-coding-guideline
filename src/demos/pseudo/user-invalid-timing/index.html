<!-- デモの中で送信しても画面が切り替わらないように、method="dialog" にしている -->
<div class="scoped user-invalid-timing">
  <form class="_form" method="dialog" data-invalid>
    <label for="user-invalid-timing-a"><code>:invalid</code> でエラーにする</label>
    <input id="user-invalid-timing-a" type="email" name="email" autocomplete="email" required>
    <button type="submit">送信する</button>
  </form>
  <form class="_form" method="dialog" data-fixed>
    <label for="user-invalid-timing-b"><code>:user-invalid</code> でエラーにする</label>
    <input id="user-invalid-timing-b" type="email" name="email" autocomplete="email" required>
    <button type="submit">送信する</button>
  </form>
</div>
