<article class="scoped prose-demo | prose" style="--prose--space: calc(var(--spacing--sm) / 16 * 1rem)">
  <h2>余白の決め方</h2>
  <p>段落と段落の間は、ルートに渡した16px相当の間隔になります。</p>
  <p>この段落の前も同じ16px相当です。子要素には何も渡していません。</p>
  <h3 style="--prose--space: calc(var(--spacing--xl) / 16 * 1rem)">見出しの前だけ広げる</h3>
  <p style="--prose--space: calc(var(--spacing--xxs) / 16 * 1rem)">見出しには40px相当、この段落には8px相当を渡しています。見出しは後ろの段落とひとまとまりに見えます。</p>
  <p>次の段落からは、ルートの16px相当に戻ります。</p>
  <aside class="prose" style="--prose--space: calc(var(--spacing--lg) / 16 * 1rem)">
    <p class="_note-title">入れ子の prose</p>
    <p>この囲みの前は32px相当、囲みの中の段落の間は8px相当です。</p>
    <p>内側の値は、コンポーネントの CSS で内側の子に渡しています。</p>
  </aside>
  <p class="_back" style="--prose--space: calc(var(--spacing--xl) / 16 * 1rem)"><a href="#">一覧へ戻る</a></p>
</article>
