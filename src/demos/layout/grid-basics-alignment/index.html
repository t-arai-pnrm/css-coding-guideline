<div class="scoped alignment-grid-demo">
  <section>
    <h3>指定なし（normal）</h3>
    <div>
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
    </div>
  </section>
  <section>
    <h3>place-items: center</h3>
    <div data-place="items">
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
    </div>
  </section>
  <section>
    <h3>place-content: center</h3>
    <div data-place="content">
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
    </div>
  </section>
  <section>
    <h3>place-content: space-between</h3>
    <div data-place="between">
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
    </div>
  </section>
</div>
