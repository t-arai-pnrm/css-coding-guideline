<div class="scoped feature-list stack" style="--stack--gap: calc(var(--spacing--lg) / 16 * 1rem)">
  <div
    class="switcher"
    style="--switcher--column-count: 3; --switcher--column-min-width: calc(200 / 16 * 1rem); --switcher--gap: calc(var(--spacing--md) / 16 * 1rem)"
  >
    <section class="_item stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">設計</h2>
      <p class="_text">要件を整理し、ページの構成と部品の分け方を決めます。</p>
    </section>
    <section class="_item stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">実装</h2>
      <p class="_text">決めた部品を、どの幅でも崩れない CSS で組み立てます。</p>
    </section>
    <section class="_item stack" style="--stack--gap: calc(var(--spacing--xxs) / 16 * 1rem)">
      <h2 class="_title">運用</h2>
      <p class="_text">公開後の更新でも、部品の組み合わせだけでページを増やせます。</p>
    </section>
  </div>
  <ul
    class="switcher"
    style="--switcher--column-count: 4; --switcher--column-min-width: calc(140 / 16 * 1rem); --switcher--gap: calc(var(--spacing--xs) / 16 * 1rem)"
  >
    <li class="_item">1</li>
    <li class="_item">2</li>
    <li class="_item">3</li>
    <li class="_item">4</li>
    <li class="_item">5</li>
  </ul>
</div>
