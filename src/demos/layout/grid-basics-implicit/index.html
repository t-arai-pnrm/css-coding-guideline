<div class="scoped implicit-demo">
  <section>
    <h3>grid-template-rows: repeat(2, 64px) だけを指定</h3>
    <div data-rows="template">
      <span data-side>1 / -1</span>
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
      <span>E</span>
      <span>F</span>
    </div>
  </section>
  <section>
    <h3>grid-auto-rows: 64px で暗黙の行を決める</h3>
    <div data-rows="auto">
      <span data-side>1 / -1</span>
      <span>A</span>
      <span>B</span>
      <span>C</span>
      <span>D</span>
      <span>E</span>
      <span>F</span>
    </div>
  </section>
</div>
