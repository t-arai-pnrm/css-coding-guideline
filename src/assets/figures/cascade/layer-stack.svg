<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 478" width="480" height="478">
  <title>9つのレイヤーとレイヤーの外を、強い順に積んだ図</title>
  <!-- 強さの矢印 -->
  <path class="_arrow" d="M14 420 V34"/>
  <polygon class="_arrowhead" points="14,26 9,36 19,36"/>
  <text class="_text-muted" x="14" y="18" font-size="13" text-anchor="middle">強い</text>
  <text class="_text-muted" x="14" y="438" font-size="13" text-anchor="middle">弱い</text>
  <!-- - レイヤーの外 -->
  <rect class="_box -accent" x="40" y="28" width="300" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="_text-accent" x="76" y="49" font-size="14" text-anchor="start" font-weight="700">レイヤーの外</text>
  <text class="_text-accent" x="192" y="49" font-size="13" text-anchor="start">入れていない CSS</text>
  <!-- 9 utilities -->
  <rect class="_box" x="40" y="68" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="89" font-size="13" text-anchor="middle">9</text>
  <text class="_text" x="76" y="89" font-size="14" text-anchor="start" font-weight="700">utilities</text>
  <text class="_text-muted" x="192" y="89" font-size="13" text-anchor="start">単機能の補助クラス</text>
  <!-- 8 patterns -->
  <rect class="_box" x="40" y="108" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="129" font-size="13" text-anchor="middle">8</text>
  <text class="_text" x="76" y="129" font-size="14" text-anchor="start" font-weight="700">patterns</text>
  <text class="_text-muted" x="192" y="129" font-size="13" text-anchor="start">静的な見た目の断片</text>
  <!-- 7 components -->
  <rect class="_box" x="40" y="148" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="169" font-size="13" text-anchor="middle">7</text>
  <text class="_text" x="76" y="169" font-size="14" text-anchor="start" font-weight="700">components</text>
  <text class="_text-muted" x="192" y="169" font-size="13" text-anchor="start">複数の場所で使う部品</text>
  <!-- 6 pages -->
  <rect class="_box" x="40" y="188" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="209" font-size="13" text-anchor="middle">6</text>
  <text class="_text" x="76" y="209" font-size="14" text-anchor="start" font-weight="700">pages</text>
  <text class="_text-muted" x="192" y="209" font-size="13" text-anchor="start">ページ固有のセクション</text>
  <!-- 5 compositions -->
  <rect class="_box" x="40" y="228" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="249" font-size="13" text-anchor="middle">5</text>
  <text class="_text" x="76" y="249" font-size="14" text-anchor="start" font-weight="700">compositions</text>
  <text class="_text-muted" x="192" y="249" font-size="13" text-anchor="start">レイアウトの再利用</text>
  <!-- 4 vendors -->
  <rect class="_box" x="40" y="268" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="289" font-size="13" text-anchor="middle">4</text>
  <text class="_text" x="76" y="289" font-size="14" text-anchor="start" font-weight="700">vendors</text>
  <text class="_text-muted" x="192" y="289" font-size="13" text-anchor="start">外部の CSS</text>
  <!-- 3 base -->
  <rect class="_box" x="40" y="308" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="329" font-size="13" text-anchor="middle">3</text>
  <text class="_text" x="76" y="329" font-size="14" text-anchor="start" font-weight="700">base</text>
  <text class="_text-muted" x="192" y="329" font-size="13" text-anchor="start">HTML 要素の見た目</text>
  <!-- 2 reset -->
  <rect class="_box" x="40" y="348" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="369" font-size="13" text-anchor="middle">2</text>
  <text class="_text" x="76" y="369" font-size="14" text-anchor="start" font-weight="700">reset</text>
  <text class="_text-muted" x="192" y="369" font-size="13" text-anchor="start">リセット（kiso.css）</text>
  <!-- 1 tokens -->
  <rect class="_box" x="40" y="388" width="300" height="32" rx="6"/>
  <text class="_text-muted" x="58" y="409" font-size="13" text-anchor="middle">1</text>
  <text class="_text" x="76" y="409" font-size="14" text-anchor="start" font-weight="700">tokens</text>
  <text class="_text-muted" x="192" y="409" font-size="13" text-anchor="start">デザイントークン</text>
  <!-- 役割のまとまり -->
  <path class="_arrow" d="M348 68 H354 V140 H348"/>
  <text class="_text-muted" x="364" y="109" font-size="13" text-anchor="start">重ねて使う</text>
  <path class="_arrow" d="M348 148 H354 V260 H348"/>
  <text class="_text-muted" x="364" y="209" font-size="13" text-anchor="start">ページの組み立て</text>
  <path class="_arrow" d="M348 308 H354 V420 H348"/>
  <text class="_text-muted" x="364" y="369" font-size="13" text-anchor="start">土台</text>
  <text class="_text-muted" x="40" y="466" font-size="13" text-anchor="start">前に宣言したレイヤーほど弱く、後ろほど強い</text>
</svg>
