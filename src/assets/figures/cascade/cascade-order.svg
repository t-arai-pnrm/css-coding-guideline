<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <title>カスケードが宣言を比べる7つの段階</title>
  <!-- 1. オリジンと重要度 -->
  <rect class="_box" x="0" y="4" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="28" r="13"/>
  <text class="_text" x="28" y="33" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text class="_text" x="54" y="34" font-size="17" font-weight="700">オリジンと重要度</text>
  <path class="_arrow" d="M270 28 H292"/>
  <polygon class="_arrowhead" points="300,28 291,23 291,33"/>
  <rect class="_box" x="300" y="10" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text" x="388" y="33" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 52 V72"/>
  <polygon class="_arrowhead" points="135,80 130,71 140,71"/>
  <text class="_text-muted" x="149" y="71" font-size="13">同じなら次へ</text>
  <!-- 2. コンテキスト -->
  <rect class="_box" x="0" y="80" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="104" r="13"/>
  <text class="_text" x="28" y="109" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text class="_text" x="54" y="110" font-size="17" font-weight="700">コンテキスト</text>
  <path class="_arrow" d="M270 104 H292"/>
  <polygon class="_arrowhead" points="300,104 291,99 291,109"/>
  <rect class="_box" x="300" y="86" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text" x="388" y="109" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 128 V148"/>
  <polygon class="_arrowhead" points="135,156 130,147 140,147"/>
  <text class="_text-muted" x="149" y="147" font-size="13">同じなら次へ</text>
  <!-- 3. style 属性 -->
  <rect class="_box" x="0" y="156" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="180" r="13"/>
  <text class="_text" x="28" y="185" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text class="_text" x="54" y="186" font-size="17" font-weight="700">style 属性</text>
  <path class="_arrow" d="M270 180 H292"/>
  <polygon class="_arrowhead" points="300,180 291,175 291,185"/>
  <rect class="_box" x="300" y="162" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text" x="388" y="185" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 204 V224"/>
  <polygon class="_arrowhead" points="135,232 130,223 140,223"/>
  <text class="_text-muted" x="149" y="223" font-size="13">同じなら次へ</text>
  <!-- 4. レイヤー -->
  <rect class="_box -accent" x="0" y="232" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="256" r="13"/>
  <text class="_text-accent" x="28" y="261" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text class="_text-accent" x="54" y="262" font-size="17" font-weight="700">レイヤー</text>
  <path class="_arrow" d="M270 256 H292"/>
  <polygon class="_arrowhead" points="300,256 291,251 291,261"/>
  <rect class="_box -accent" x="300" y="238" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text-accent" x="388" y="261" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 280 V300"/>
  <polygon class="_arrowhead" points="135,308 130,299 140,299"/>
  <text class="_text-muted" x="149" y="299" font-size="13">同じなら次へ</text>
  <!-- 5. 詳細度 -->
  <rect class="_box" x="0" y="308" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="332" r="13"/>
  <text class="_text" x="28" y="337" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text class="_text" x="54" y="338" font-size="17" font-weight="700">詳細度</text>
  <path class="_arrow" d="M270 332 H292"/>
  <polygon class="_arrowhead" points="300,332 291,327 291,337"/>
  <rect class="_box" x="300" y="314" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text" x="388" y="337" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 356 V376"/>
  <polygon class="_arrowhead" points="135,384 130,375 140,375"/>
  <text class="_text-muted" x="149" y="375" font-size="13">同じなら次へ</text>
  <!-- 6. スコープの近さ -->
  <rect class="_box" x="0" y="384" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="408" r="13"/>
  <text class="_text" x="28" y="413" font-size="14" font-weight="700" text-anchor="middle">6</text>
  <text class="_text" x="54" y="414" font-size="17" font-weight="700">スコープの近さ</text>
  <path class="_arrow" d="M270 408 H292"/>
  <polygon class="_arrowhead" points="300,408 291,403 291,413"/>
  <rect class="_box" x="300" y="390" width="176" height="36" rx="18" stroke-dasharray="4 3"/>
  <text class="_text" x="388" y="413" font-size="14" text-anchor="middle">差がつけば決着</text>
  <path class="_arrow" d="M135 432 V452"/>
  <polygon class="_arrowhead" points="135,460 130,451 140,451"/>
  <text class="_text-muted" x="149" y="451" font-size="13">同じなら次へ</text>
  <!-- 7. 出現順 -->
  <rect class="_box -accent" x="0" y="460" width="270" height="48" rx="8"/>
  <circle class="_arrow" cx="28" cy="484" r="13"/>
  <text class="_text-accent" x="28" y="489" font-size="14" font-weight="700" text-anchor="middle">7</text>
  <text class="_text-accent" x="54" y="490" font-size="17" font-weight="700">出現順</text>
  <path class="_arrow" d="M270 484 H292"/>
  <polygon class="_arrowhead" points="300,484 291,479 291,489"/>
  <rect class="_box -accent" x="300" y="466" width="176" height="36" rx="18"/>
  <text class="_text-accent" x="388" y="489" font-size="14" text-anchor="middle">後に書いた宣言が勝つ</text>
  <!-- 凡例 -->
  <rect class="_box -accent" x="0" y="536" width="16" height="16" rx="3"/>
  <text class="_text-muted" x="26" y="549" font-size="13">本書が優先順位の設計に使う段</text>
</svg>
