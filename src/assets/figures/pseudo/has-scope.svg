<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 364" width="480" height="364">
  <title>:has() の引数ごとの探索範囲</title>
  <text class="_text-muted" x="333" y="12" font-size="13" text-anchor="middle">:has() の引数</text>
  <text class="_text" x="231" y="33" font-size="14" text-anchor="middle" font-weight="700">img</text>
  <text class="_text-muted" x="231" y="51" font-size="12" text-anchor="middle">子孫</text>
  <text class="_text" x="299" y="33" font-size="14" text-anchor="middle" font-weight="700">> img</text>
  <text class="_text-muted" x="299" y="51" font-size="12" text-anchor="middle">直接の子</text>
  <text class="_text" x="367" y="33" font-size="14" text-anchor="middle" font-weight="700">+ p</text>
  <text class="_text-muted" x="367" y="51" font-size="12" text-anchor="middle">直後の兄弟</text>
  <text class="_text" x="435" y="33" font-size="14" text-anchor="middle" font-weight="700">~ p</text>
  <text class="_text-muted" x="435" y="51" font-size="12" text-anchor="middle">後ろの兄弟</text>
  <!-- 木の連結線 -->
  <path class="_arrow" d="M10 130 V191"/>
  <path class="_arrow" d="M10 153 H20"/>
  <path class="_arrow" d="M10 191 H20"/>
  <path class="_arrow" d="M30 206 V229"/>
  <path class="_arrow" d="M30 229 H40"/>
  <!-- h2（前の兄弟） -->
  <rect class="_box" x="0" y="62" width="190" height="30" rx="6"/>
  <text class="_text" x="12" y="82" font-size="14" text-anchor="start">h2（前の兄弟）</text>
  <rect class="_box" x="200" y="62" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="268" y="62" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="336" y="62" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="404" y="62" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <!-- .card（起点） -->
  <rect class="_box -accent" x="0" y="100" width="190" height="30" rx="6"/>
  <text class="_text-accent" x="12" y="120" font-size="14" text-anchor="start" font-weight="700">.card（起点）</text>
  <rect class="_box" x="200" y="100" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="268" y="100" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="336" y="100" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="404" y="100" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <!-- img（子） -->
  <rect class="_box" x="20" y="138" width="170" height="30" rx="6"/>
  <text class="_text" x="32" y="158" font-size="14" text-anchor="start">img（子）</text>
  <rect class="_box -accent" x="200" y="138" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="231" y="158" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box -accent" x="268" y="138" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="299" y="158" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box" x="336" y="138" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="404" y="138" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <!-- div（子） -->
  <rect class="_box" x="20" y="176" width="170" height="30" rx="6"/>
  <text class="_text" x="32" y="196" font-size="14" text-anchor="start">div（子）</text>
  <rect class="_box -accent" x="200" y="176" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="231" y="196" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box -accent" x="268" y="176" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="299" y="196" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box" x="336" y="176" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="404" y="176" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <!-- span（孫） -->
  <rect class="_box" x="40" y="214" width="150" height="30" rx="6"/>
  <text class="_text" x="52" y="234" font-size="14" text-anchor="start">span（孫）</text>
  <rect class="_box -accent" x="200" y="214" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="231" y="234" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box" x="268" y="214" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="336" y="214" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="404" y="214" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <!-- p（直後の兄弟） -->
  <rect class="_box" x="0" y="252" width="190" height="30" rx="6"/>
  <text class="_text" x="12" y="272" font-size="14" text-anchor="start">p（直後の兄弟）</text>
  <rect class="_box" x="200" y="252" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="268" y="252" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box -accent" x="336" y="252" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="367" y="272" font-size="14" text-anchor="middle">○ 探索</text>
  <rect class="_box -accent" x="404" y="252" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="435" y="272" font-size="14" text-anchor="middle">○ 探索</text>
  <!-- p（その後ろの兄弟） -->
  <rect class="_box" x="0" y="290" width="190" height="30" rx="6"/>
  <text class="_text" x="12" y="310" font-size="14" text-anchor="start">p（その後ろの兄弟）</text>
  <rect class="_box" x="200" y="290" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="268" y="290" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box" x="336" y="290" width="62" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <rect class="_box -accent" x="404" y="290" width="62" height="30" rx="6"/>
  <text class="_text-accent" x="435" y="310" font-size="14" text-anchor="middle">○ 探索</text>
  <text class="_text-muted" x="0" y="350" font-size="13" text-anchor="start">スタイルが当たるのは、探索される要素ではなく起点の .card</text>
</svg>
