<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 286" width="480" height="286">
  <title>:has(:not(img)) と :not(:has(img)) が当たるカード</title>
  <!-- 1枚目 -->
  <text class="_text-muted" x="74" y="14" font-size="13" text-anchor="middle">1枚目</text>
  <rect class="_box" x="0" y="24" width="148" height="84" rx="8"/>
  <rect class="_box -accent" x="10" y="34" width="128" height="24" rx="4"/>
  <text class="_text-accent" x="74" y="51" font-size="13" text-anchor="middle" font-weight="700">img</text>
  <rect class="_box" x="10" y="66" width="128" height="24" rx="4"/>
  <text class="_text" x="74" y="83" font-size="13" text-anchor="middle">span（説明文）</text>
  <!-- 2枚目 -->
  <text class="_text-muted" x="234" y="14" font-size="13" text-anchor="middle">2枚目</text>
  <rect class="_box" x="160" y="24" width="148" height="84" rx="8"/>
  <rect class="_box" x="170" y="34" width="128" height="24" rx="4"/>
  <text class="_text" x="234" y="51" font-size="13" text-anchor="middle">span（説明文）</text>
  <!-- 3枚目 -->
  <text class="_text-muted" x="394" y="14" font-size="13" text-anchor="middle">3枚目</text>
  <rect class="_box" x="320" y="24" width="148" height="84" rx="8"/>
  <rect class="_box -accent" x="330" y="34" width="128" height="24" rx="4"/>
  <text class="_text-accent" x="394" y="51" font-size="13" text-anchor="middle" font-weight="700">img</text>
  <!-- .card:has(:not(img)) -->
  <text class="_text" x="0" y="126" font-size="14" text-anchor="start" font-weight="700" style="font-family: var(--sl-font-mono)">.card:has(:not(img))</text>
  <text class="_text-muted" x="480" y="126" font-size="13" text-anchor="end">意図と違う</text>
  <rect class="_box -accent" x="0" y="134" width="148" height="30" rx="6"/>
  <text class="_text-accent" x="74" y="154" font-size="14" text-anchor="middle">○ 当たる</text>
  <rect class="_box -accent" x="160" y="134" width="148" height="30" rx="6"/>
  <text class="_text-accent" x="234" y="154" font-size="14" text-anchor="middle">○ 当たる</text>
  <rect class="_box" x="320" y="134" width="148" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <text class="_text-muted" x="394" y="154" font-size="14" text-anchor="middle">× 当たらない</text>
  <!-- .card:not(:has(img)) -->
  <text class="_text" x="0" y="196" font-size="14" text-anchor="start" font-weight="700" style="font-family: var(--sl-font-mono)">.card:not(:has(img))</text>
  <text class="_text-accent" x="480" y="196" font-size="13" text-anchor="end">意図どおり</text>
  <rect class="_box" x="0" y="204" width="148" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <text class="_text-muted" x="74" y="224" font-size="14" text-anchor="middle">× 当たらない</text>
  <rect class="_box -accent" x="160" y="204" width="148" height="30" rx="6"/>
  <text class="_text-accent" x="234" y="224" font-size="14" text-anchor="middle">○ 当たる</text>
  <rect class="_box" x="320" y="204" width="148" height="30" rx="6" stroke-dasharray="4 3" fill-opacity="0.4"/>
  <text class="_text-muted" x="394" y="224" font-size="14" text-anchor="middle">× 当たらない</text>
  <text class="_text-muted" x="0" y="274" font-size="13" text-anchor="start">「画像を持たないカード」は2枚目だけ</text>
</svg>
