<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" width="480" height="190">
  <title>cqi の基準になるコンテナ。最も近い祖先のコンテナが基準になる</title>
  <text class="_text-muted" x="400" y="14" font-size="13" text-anchor="middle">子孫の cqi の基準</text>
  <!-- 木の連結線 -->
  <path class="_arrow" d="M10 62 V150"/>
  <path class="_arrow" d="M10 88 H20"/>
  <path class="_arrow" d="M30 104 V150"/>
  <path class="_arrow" d="M30 130 H40"/>
  <!-- ルート -->
  <rect class="_box -accent" x="0" y="30" width="300" height="32" rx="6"/>
  <text class="_text-accent" x="12" y="51" font-size="14" text-anchor="start" font-weight="700">.scoped.card（--scoped）</text>
  <!-- ._body -->
  <rect class="_box -accent" x="20" y="72" width="280" height="32" rx="6"/>
  <text class="_text-accent" x="32" y="93" font-size="14" text-anchor="start" font-weight="700">._body（--body）</text>
  <!-- p -->
  <rect class="_box" x="40" y="114" width="260" height="32" rx="6"/>
  <text class="_text" x="52" y="135" font-size="14" text-anchor="start">p { font-size: 5cqi }</text>
  <!-- 基準 -->
  <rect class="_box -accent" x="320" y="72" width="160" height="32" rx="6"/>
  <text class="_text-accent" x="400" y="93" font-size="14" text-anchor="middle">○ 基準になる</text>
  <rect class="_box" x="320" y="30" width="160" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="_text-muted" x="400" y="51" font-size="14" text-anchor="middle">× 基準にならない</text>
  <!-- 凡例 -->
  <rect class="_box -accent" x="0" y="172" width="16" height="16" rx="3"/>
  <text class="_text-muted" x="26" y="185" font-size="13" text-anchor="start">コンテナにした要素</text>
</svg>
