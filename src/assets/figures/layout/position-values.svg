<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 438" width="480" height="438">
  <title>relative、absolute、fixed、sticky の違い</title>
  <g transform="translate(0 0)">
  <!-- relative -->
  <text class="_text" x="0" y="16" font-size="14" text-anchor="start" font-weight="700">relative</text>
  <rect class="_box" x="0" y="26" width="232" height="114" rx="8"/>
  <rect class="_box" x="12" y="36" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="54" font-size="13" text-anchor="middle">A</text>
  <rect class="_guide" x="12" y="70" width="100" height="26" rx="5"/>
  <text class="_text-muted" x="18" y="87" font-size="12" text-anchor="start">元の場所</text>
  <rect class="_box" x="12" y="104" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="122" font-size="13" text-anchor="middle">C</text>
  <rect class="_box -accent" x="60" y="88" width="100" height="26" rx="5"/>
  <text class="_text-accent" x="110" y="106" font-size="13" text-anchor="middle" font-weight="700">B</text>
  <text class="_text-muted" x="0" y="162" font-size="13" text-anchor="start">元の場所は空けたまま、</text>
  <text class="_text-muted" x="0" y="180" font-size="13" text-anchor="start">描かれる位置だけずれる</text>
  </g>
  <g transform="translate(248 0)">
  <!-- absolute -->
  <text class="_text" x="0" y="16" font-size="14" text-anchor="start" font-weight="700">absolute</text>
  <rect class="_box" x="0" y="26" width="232" height="114" rx="8"/>
  <rect class="_box" x="12" y="36" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="54" font-size="13" text-anchor="middle">A</text>
  <rect class="_box" x="12" y="70" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="88" font-size="13" text-anchor="middle">C</text>
  <rect class="_box -accent" x="120" y="36" width="100" height="26" rx="5"/>
  <text class="_text-accent" x="170" y="54" font-size="13" text-anchor="middle" font-weight="700">B</text>
  <text class="_text-muted" x="0" y="162" font-size="13" text-anchor="start">場所を占めない。</text>
  <text class="_text-muted" x="0" y="180" font-size="13" text-anchor="start">後ろの要素は詰めて並ぶ</text>
  </g>
  <g transform="translate(0 208)">
  <!-- fixed -->
  <text class="_text" x="0" y="16" font-size="14" text-anchor="start" font-weight="700">fixed</text>
  <rect class="_box -accent" x="0" y="26" width="232" height="114" rx="8" fill-opacity="0.35"/>
  <rect class="_box" x="12" y="36" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="54" font-size="13" text-anchor="middle">A</text>
  <rect class="_box" x="12" y="70" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="88" font-size="13" text-anchor="middle">C</text>
  <rect class="_guide" x="12" y="104" width="100" height="26" rx="5"/>
  <text class="_text-muted" x="62" y="121" font-size="12" text-anchor="middle">続きの内容</text>
  <rect class="_box -accent" x="120" y="36" width="100" height="26" rx="5"/>
  <text class="_text-accent" x="170" y="54" font-size="13" text-anchor="middle" font-weight="700">B</text>
  <path class="_arrow" d="M170 96 V128"/>
  <polygon class="_arrowhead" points="170,134 165,125 175,125"/>
  <text class="_text-muted" x="170" y="90" font-size="12" text-anchor="middle">スクロール</text>
  <text class="_text-muted" x="0" y="162" font-size="13" text-anchor="start">ビューポートが基準。</text>
  <text class="_text-muted" x="0" y="180" font-size="13" text-anchor="start">スクロールしても動かない</text>
  </g>
  <g transform="translate(248 208)">
  <!-- sticky -->
  <text class="_text" x="0" y="16" font-size="14" text-anchor="start" font-weight="700">sticky</text>
  <rect class="_box -accent" x="0" y="26" width="232" height="114" rx="8" fill-opacity="0.35"/>
  <rect class="_box -accent" x="12" y="36" width="100" height="26" rx="5"/>
  <text class="_text-accent" x="62" y="54" font-size="13" text-anchor="middle" font-weight="700">B</text>
  <rect class="_box" x="12" y="70" width="100" height="26" rx="5"/>
  <text class="_text" x="62" y="88" font-size="13" text-anchor="middle">C</text>
  <path class="_arrow" d="M6 112 H226" stroke-dasharray="4 3"/>
  <path class="_arrow" d="M6 26 V112 M226 26 V112" stroke-dasharray="4 3"/>
  <text class="_text-muted" x="120" y="100" font-size="12" text-anchor="start">親の範囲</text>
  <path class="_arrow" d="M150 78 V50"/>
  <polygon class="_arrowhead" points="150,44 145,53 155,53"/>
  <text class="_text-muted" x="158" y="66" font-size="12" text-anchor="start">スクロール</text>
  <text class="_text-muted" x="0" y="162" font-size="13" text-anchor="start">場所を占めたまま、親の</text>
  <text class="_text-muted" x="0" y="180" font-size="13" text-anchor="start">範囲の中でだけずれる</text>
  </g>
  <rect class="_box -accent" x="0" y="414" width="16" height="16" rx="3"/>
  <text class="_text-muted" x="26" y="427" font-size="13" text-anchor="start">B が対象の要素。A と C は前後の要素</text>
</svg>
