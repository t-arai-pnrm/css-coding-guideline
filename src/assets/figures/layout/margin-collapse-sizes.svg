<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 374" width="480" height="374">
  <title>相殺した margin の大きさ</title>
  <path class="_guide" d="M320 14 V338"/>
  <text class="_text-muted" x="320" y="10" font-size="12" text-anchor="middle">0</text>
  <!-- 正と正 -->
  <text class="_text" x="0" y="38" font-size="14" text-anchor="start" font-weight="700">正と正</text>
  <text class="_text-muted" x="0" y="56" font-size="12" text-anchor="start">大きいほう</text>
  <rect class="_box" x="320" y="26" width="57.599999999999994" height="10" rx="2"/>
  <text class="_text-muted" x="383.6" y="36" font-size="12" text-anchor="start">24px</text>
  <rect class="_box" x="320" y="42" width="96" height="10" rx="2"/>
  <text class="_text-muted" x="422" y="52" font-size="12" text-anchor="start">40px</text>
  <rect class="_box -accent" x="320" y="64" width="96" height="14" rx="2"/>
  <text class="_text-accent" x="422" y="76" font-size="13" text-anchor="start" font-weight="700">40px</text>
  <!-- 正と負 -->
  <text class="_text" x="0" y="116" font-size="14" text-anchor="start" font-weight="700">正と負</text>
  <text class="_text-muted" x="0" y="134" font-size="12" text-anchor="start">足す</text>
  <rect class="_box" x="320" y="104" width="72" height="10" rx="2"/>
  <text class="_text-muted" x="398" y="114" font-size="12" text-anchor="start">30px</text>
  <rect class="_box" x="272" y="120" width="48" height="10" rx="2"/>
  <text class="_text-muted" x="326" y="130" font-size="12" text-anchor="start">-20px</text>
  <rect class="_box -accent" x="320" y="142" width="24" height="14" rx="2"/>
  <text class="_text-accent" x="350" y="154" font-size="13" text-anchor="start" font-weight="700">10px</text>
  <!-- 負と負 -->
  <text class="_text" x="0" y="194" font-size="14" text-anchor="start" font-weight="700">負と負</text>
  <text class="_text-muted" x="0" y="212" font-size="12" text-anchor="start">絶対値の</text>
  <text class="_text-muted" x="0" y="228" font-size="12" text-anchor="start">大きいほう</text>
  <rect class="_box" x="260" y="182" width="60" height="10" rx="2"/>
  <text class="_text-muted" x="326" y="192" font-size="12" text-anchor="start">-25px</text>
  <rect class="_box" x="140" y="198" width="180" height="10" rx="2"/>
  <text class="_text-muted" x="326" y="208" font-size="12" text-anchor="start">-75px</text>
  <rect class="_box -accent" x="140" y="220" width="180" height="14" rx="2"/>
  <text class="_text-accent" x="326" y="232" font-size="13" text-anchor="start" font-weight="700">-75px</text>
  <!-- 3つ以上 -->
  <text class="_text" x="0" y="272" font-size="14" text-anchor="start" font-weight="700">3つ以上</text>
  <text class="_text-muted" x="0" y="290" font-size="12" text-anchor="start">正の最大から</text>
  <text class="_text-muted" x="0" y="306" font-size="12" text-anchor="start">負の絶対値の最大を</text>
  <text class="_text-muted" x="0" y="322" font-size="12" text-anchor="start">引く</text>
  <rect class="_box" x="320" y="260" width="96" height="10" rx="2"/>
  <text class="_text-muted" x="422" y="270" font-size="12" text-anchor="start">40px</text>
  <rect class="_box" x="281.6" y="276" width="38.4" height="10" rx="2"/>
  <text class="_text-muted" x="326" y="286" font-size="12" text-anchor="start">-16px</text>
  <rect class="_box" x="320" y="292" width="57.599999999999994" height="10" rx="2"/>
  <text class="_text-muted" x="383.6" y="302" font-size="12" text-anchor="start">24px</text>
  <rect class="_box -accent" x="320" y="314" width="57.599999999999994" height="14" rx="2"/>
  <text class="_text-accent" x="383.6" y="326" font-size="13" text-anchor="start" font-weight="700">24px</text>
  <!-- 凡例 -->
  <rect class="_box" x="0" y="348" width="22" height="10" rx="2"/>
  <text class="_text-muted" x="30" y="358" font-size="13" text-anchor="start">相殺に加わる margin</text>
  <rect class="_box -accent" x="190" y="346" width="22" height="14" rx="2"/>
  <text class="_text-muted" x="220" y="358" font-size="13" text-anchor="start">相殺した結果</text>
</svg>
