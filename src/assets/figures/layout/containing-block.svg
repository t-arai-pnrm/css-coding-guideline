<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392">
  <title>子の position の値ごとに、包含ブロックになる祖先の領域</title>
  <!-- ビューポート -->
  <rect class="_box -accent" x="40" y="20" width="400" height="262" rx="10" fill-opacity="0.35"/>
  <text class="_text-muted" x="54" y="40" font-size="13" text-anchor="start">ビューポート</text>
  <!-- position: relative のカード -->
  <rect class="_box" x="70" y="52" width="340" height="206" rx="8" stroke-width="4"/>
  <rect class="_box -accent" x="74" y="56" width="332" height="198" rx="5" stroke-dasharray="5 3"/>
  <text class="_text" x="88" y="76" font-size="13" text-anchor="start">position: relative のカード</text>
  <!-- position: static の div -->
  <rect class="_box" x="100" y="90" width="280" height="150" rx="6"/>
  <text class="_text" x="114" y="110" font-size="13" text-anchor="start">position: static の div</text>
  <rect class="_box -accent" x="114" y="118" width="252" height="108" rx="4" stroke-dasharray="5 3"/>
  <rect class="_box" x="130" y="138" width="120" height="44" rx="5"/>
  <text class="_text" x="190" y="165" font-size="13" text-anchor="middle">子要素</text>
  <circle class="_box -accent" cx="440" cy="20" r="11"/>
  <text class="_text-accent" x="440" y="25" font-size="13" text-anchor="middle" font-weight="700">3</text>
  <circle class="_box -accent" cx="406" cy="56" r="11"/>
  <text class="_text-accent" x="406" y="61" font-size="13" text-anchor="middle" font-weight="700">2</text>
  <circle class="_box -accent" cx="366" cy="118" r="11"/>
  <text class="_text-accent" x="366" y="123" font-size="13" text-anchor="middle" font-weight="700">1</text>
  <!-- 凡例 -->
  <circle class="_box -accent" cx="51" cy="312" r="11"/>
  <text class="_text-accent" x="51" y="317" font-size="13" text-anchor="middle" font-weight="700">1</text>
  <text class="_text" x="72" y="317" font-size="14" text-anchor="start">static / relative / sticky：親の内容の領域</text>
  <circle class="_box -accent" cx="51" cy="342" r="11"/>
  <text class="_text-accent" x="51" y="347" font-size="13" text-anchor="middle" font-weight="700">2</text>
  <text class="_text" x="72" y="347" font-size="14" text-anchor="start">absolute：static 以外の祖先の padding の領域</text>
  <circle class="_box -accent" cx="51" cy="372" r="11"/>
  <text class="_text-accent" x="51" y="377" font-size="13" text-anchor="middle" font-weight="700">3</text>
  <text class="_text" x="72" y="377" font-size="14" text-anchor="start">fixed：ビューポート</text>
</svg>
