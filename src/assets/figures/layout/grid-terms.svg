<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <title>グリッド線、トラック、セル、グリッドエリア、溝</title>
  <text class="_text-muted" x="240" y="14" font-size="13" text-anchor="middle">グリッド線の番号は、始まりの側から 1、2、3、4</text>
  <!-- セル -->
  <rect class="_box -accent" x="60" y="60" width="100" height="64" rx="4"/>
  <rect class="_box" x="188" y="60" width="100" height="64" rx="4"/>
  <rect class="_box" x="316" y="60" width="100" height="64" rx="4"/>
  <rect class="_box" x="60" y="152" width="100" height="64" rx="4"/>
  <rect class="_box" x="188" y="152" width="100" height="64" rx="4"/>
  <rect class="_box" x="316" y="152" width="100" height="64" rx="4"/>
  <text class="_text-accent" x="110" y="97" font-size="14" text-anchor="middle" font-weight="700">セル</text>
  <!-- 溝 -->
  <rect class="_box -accent" x="160" y="60" width="28" height="156" rx="0" fill-opacity="0.45" stroke-dasharray="4 3"/>
  <text class="_text-accent" font-size="12" font-weight="700" text-anchor="middle" transform="translate(178 138) rotate(-90)">溝（gap）</text>
  <!-- トラック -->
  <rect class="_curve-faint" x="187" y="56" width="102" height="164" rx="6"/>
  <text class="_text-accent" x="238" y="92" font-size="14" text-anchor="middle" font-weight="700">トラック</text>
  <text class="_text-accent" x="238" y="110" font-size="12" text-anchor="middle">（列）</text>
  <!-- グリッドエリア -->
  <rect class="_curve-faint" x="315" y="56" width="102" height="164" rx="6"/>
  <text class="_text-accent" x="366" y="136" font-size="14" text-anchor="middle" font-weight="700">エリア</text>
  <text class="_text-accent" x="366" y="154" font-size="12" text-anchor="middle">（2セル分）</text>
  <!-- 線の番号 -->
  <path class="_arrow" d="M60 42 V54"/>
  <path class="_arrow" d="M60 222 V234"/>
  <text class="_text" x="60" y="36" font-size="13" text-anchor="middle">1</text>
  <text class="_text-muted" x="60" y="250" font-size="13" text-anchor="middle">-4</text>
  <path class="_arrow" d="M174 42 V54"/>
  <path class="_arrow" d="M174 222 V234"/>
  <text class="_text" x="174" y="36" font-size="13" text-anchor="middle">2</text>
  <text class="_text-muted" x="174" y="250" font-size="13" text-anchor="middle">-3</text>
  <path class="_arrow" d="M302 42 V54"/>
  <path class="_arrow" d="M302 222 V234"/>
  <text class="_text" x="302" y="36" font-size="13" text-anchor="middle">3</text>
  <text class="_text-muted" x="302" y="250" font-size="13" text-anchor="middle">-2</text>
  <path class="_arrow" d="M416 42 V54"/>
  <path class="_arrow" d="M416 222 V234"/>
  <text class="_text" x="416" y="36" font-size="13" text-anchor="middle">4</text>
  <text class="_text-muted" x="416" y="250" font-size="13" text-anchor="middle">-1</text>
  <path class="_arrow" d="M42 60 H54"/>
  <path class="_arrow" d="M422 60 H434"/>
  <text class="_text" x="36" y="64" font-size="13" text-anchor="end">1</text>
  <text class="_text-muted" x="440" y="64" font-size="13" text-anchor="start">-3</text>
  <path class="_arrow" d="M42 138 H54"/>
  <path class="_arrow" d="M422 138 H434"/>
  <text class="_text" x="36" y="142" font-size="13" text-anchor="end">2</text>
  <text class="_text-muted" x="440" y="142" font-size="13" text-anchor="start">-2</text>
  <path class="_arrow" d="M42 216 H54"/>
  <path class="_arrow" d="M422 216 H434"/>
  <text class="_text" x="36" y="220" font-size="13" text-anchor="end">3</text>
  <text class="_text-muted" x="440" y="220" font-size="13" text-anchor="start">-1</text>
  <text class="_text-muted" x="240" y="278" font-size="13" text-anchor="middle">終わりの側からは -4、-3、-2、-1（行の線も同じ）</text>
</svg>
