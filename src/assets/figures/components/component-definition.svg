<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" width="480" height="324">
  <title>コンポーネントの定義とインスタンス、入力点、契約</title>
  <!-- 定義 -->
  <rect class="_box -accent" x="0" y="0" width="210" height="172" rx="6"/>
  <text class="_text-accent" x="12" y="24" font-size="15" font-weight="700">product-card</text>
  <text class="_text-muted" x="12" y="43" font-size="12">1つの定義（ファイルは1つ）</text>
  <text class="_text" x="12" y="70" font-size="13" font-weight="700">入力点</text>
  <text class="_text-muted" x="12" y="90" font-size="12">props（商品名、価格）</text>
  <text class="_text-muted" x="12" y="108" font-size="12">スロット（画像）</text>
  <text class="_text-muted" x="12" y="126" font-size="12">data-variant（featured）</text>
  <text class="_text-muted" x="12" y="144" font-size="12">公開プロパティ</text>
  <text class="_text-muted" x="24" y="161" font-size="12">--product-card--accent</text>
  <!-- 定義からインスタンスへ -->
  <path class="_arrow" d="M210 80 H250"/>
  <path class="_arrow" d="M250 22 V138"/>
  <path class="_arrow" d="M250 22 H282"/>
  <path class="_arrow" d="M250 80 H282"/>
  <path class="_arrow" d="M250 138 H282"/>
  <polygon class="_arrowhead" points="290,22 282,18 282,26"/>
  <polygon class="_arrowhead" points="290,80 282,76 282,84"/>
  <polygon class="_arrowhead" points="290,138 282,134 282,142"/>
  <!-- インスタンス -->
  <rect class="_box" x="290" y="0" width="190" height="44" rx="6"/>
  <text class="_text-muted" x="302" y="18" font-size="11">インスタンス</text>
  <text class="_text" x="302" y="35" font-size="13">リネンのシャツ　8,800円</text>
  <rect class="_box" x="290" y="58" width="190" height="44" rx="6"/>
  <text class="_text-muted" x="302" y="76" font-size="11">インスタンス</text>
  <text class="_text" x="302" y="93" font-size="13">ウールのコート　24,000円</text>
  <rect class="_box -accent" x="290" y="116" width="190" height="44" rx="6"/>
  <text class="_text-muted" x="302" y="134" font-size="11">インスタンス（featured）</text>
  <text class="_text-accent" x="302" y="151" font-size="13">コットンのシャツ　6,800円</text>
  <!-- 契約 -->
  <rect class="_box" x="0" y="196" width="480" height="128" rx="6"/>
  <text class="_text" x="12" y="220" font-size="14" font-weight="700">契約：使う側が依存する約束</text>
  <text class="_text-muted" x="12" y="248" font-size="13">出力するHTML：構造は定義が決める</text>
  <text class="_text-muted" x="12" y="272" font-size="13">見た目：@scope の内側は定義が受け持つ</text>
  <text class="_text-muted" x="12" y="296" font-size="13">使う側：入力点だけで調整し、中の構造に触れない</text>
</svg>
