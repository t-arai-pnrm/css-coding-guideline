<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img">
  <title>ブラウザのUIの表示状態と、svb・lvb・dvbが指す高さ</title>
  <rect width="720" height="530" fill="#ffffff"/>
  <!-- 左：UIが表示されている -->
  <rect x="40" y="30" width="180" height="440" rx="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <rect x="50" y="50" width="160" height="400" fill="#e5e7eb"/>
  <rect x="50" y="50" width="160" height="46" fill="#9ca3af"/>
  <text x="130" y="79" font-size="14" fill="#111827" text-anchor="middle">アドレスバー</text>
  <rect x="50" y="96" width="160" height="308" fill="#dbeafe"/>
  <text x="130" y="255" font-size="14" fill="#1e3a8a" text-anchor="middle">見えている領域</text>
  <rect x="50" y="404" width="160" height="46" fill="#9ca3af"/>
  <text x="130" y="433" font-size="14" fill="#111827" text-anchor="middle">ツールバー</text>
  <path d="M232 96 H242 V404 H232" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="252" y="242" font-size="18" font-weight="700" fill="#1d4ed8">100svb</text>
  <text x="252" y="268" font-size="16" fill="#374151">＝100dvb</text>
  <text x="130" y="505" font-size="16" fill="#111827" text-anchor="middle">UIが表示されている</text>

  <!-- 右：UIが引っ込んでいる -->
  <rect x="380" y="30" width="180" height="440" rx="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <rect x="390" y="50" width="160" height="400" fill="#dbeafe"/>
  <text x="470" y="255" font-size="14" fill="#1e3a8a" text-anchor="middle">見えている領域</text>
  <path d="M572 50 H582 V450 H572" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="592" y="242" font-size="18" font-weight="700" fill="#b45309">100lvb</text>
  <text x="592" y="268" font-size="16" fill="#374151">＝100dvb</text>
  <text x="470" y="505" font-size="16" fill="#111827" text-anchor="middle">スクロールしてUIが引っ込んだ</text>
</svg>
